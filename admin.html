/* SHAMLOKO · OPTION A: WARM FOREST — visual-only theme */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap');
:root{
 --bg:#F5F1E8; --card:#FFFCF6; --g:#164E3B; --gl:#E5EDE4;
 --t:#252A28; --m:#68736B; --bd:#DEDCCF; --hot:#A65B42;

 --soft:#F0E9DA; --shadow:0 5px 18px rgba(37,42,40,.055);
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--t);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.005em}
h1,h2,h3,h4,.auth-brand,header>span,.profile-head b{font-family:'Poppins','Inter',sans-serif;letter-spacing:-.02em}
h1{color:var(--forest);font-weight:700}h3{color:var(--forest);font-weight:600}
header,nav,#menuPanel,#hsearch,.home-top,.profile-head{background:var(--card);border-color:var(--bd)}
header{box-shadow:0 2px 10px rgba(37,42,40,.035)}
header b,.auth-brand b{color:var(--sage)}
.card,.k{background:var(--card);border-color:var(--bd);box-shadow:var(--shadow)}

input::placeholder,textarea::placeholder{color:#92988F}

button{background:var(--forest);color:#fff;border-color:var(--forest);font-weight:700;transition:background .15s ease,border-color .15s ease}
button:hover{background:#103D2E}
button.alt,.acts button,.hbtn,.bell{background:var(--card);color:var(--forest);border:1px solid var(--sage)}
button.alt:hover,.acts button:hover,.hbtn:hover,.bell:hover{background:var(--gl)}
button.a,button.g,.tabs button.on,nav button.post,.hbtn.primary{background:var(--forest);color:#fff;border-color:var(--forest)}
nav{border-top-color:var(--bd);box-shadow:0 -3px 12px rgba(37,42,40,.035)}
nav button{background:transparent;color:var(--m)}nav button.on{color:var(--forest);font-weight:800}
.tag,.chip.on,.pn{background:var(--gl);color:var(--forest);border-color:var(--gl)}
.chip{background:var(--card);border-color:var(--bd);color:var(--t)}
.band{background:var(--forest);color:#fff}
.sep{background:var(--bd)}
.feed-title,.feed-title.hot{color:var(--forest);border-color:var(--bd)}

.posted-by .posted-label{color:var(--sage)}
.job-deadline,.err,button.r{color:var(--hot)}
button.r{background:var(--card);border-color:#D7B5A8}
#bc{background:var(--hot);color:#fff}
.av,.av2{background:var(--gl);color:var(--forest)}
.unread{border-left-color:var(--sage)}
.m{background:#EEECE4}.m.me{background:var(--gl)}.bub{background:#EEECE4}
.pc{border-color:var(--sage)}
.pn{background:var(--gl)}

button.r{background:#FFFCF6;color:#A65B42;border-color:#D7B5A8}header{background:#FFFCF6;color:#164E3B}body{background:#F5F1E8;color:#252A28} .card,.k{background:#FFFCF6;border-color:#DEDCCF;box-shadow:0 5px 18px rgba(37,42,40,.055)} .tabs button.on,button.g{background:#164E3B;border-color:#164E3B}input{background:#FFFEFA;border-color:#DEDCCF}a{color:#164E3B}@media(max-width:640px){main{padding:10px}}

/* Revenue overview */
.revenue-hero{background:linear-gradient(135deg,#164E3B 0%,#23664D 62%,#78977D 100%);color:#fff;border:0;box-shadow:0 12px 28px rgba(22,78,59,.16);padding:20px;border-radius:18px}
.revenue-hero .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;opacity:.78;font-weight:800}
.revenue-hero .total{font:700 clamp(30px,6vw,42px) 'Poppins',sans-serif;letter-spacing:-.04em;margin:5px 0 12px}
.revenue-hero .hero-meta{display:flex;gap:22px;flex-wrap:wrap}
.revenue-hero .hero-meta span{display:block;font-size:11px;opacity:.78}
.revenue-hero .hero-meta b{display:block;font-size:17px;margin-top:2px}
.revenue-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.rev-card{appearance:none;text-align:left;white-space:normal;background:var(--card);color:var(--t);border:1px solid var(--bd);border-radius:14px;padding:13px;min-width:0;box-shadow:var(--shadow)}
.rev-card:hover,.rev-card.selected{background:var(--gl);border-color:var(--sage);color:var(--forest)}
.rev-card .rev-label{display:block;color:var(--m);font-size:11px;font-weight:700}
.rev-card strong{display:block;color:var(--forest);font:700 21px 'Poppins',sans-serif;margin:5px 0}
.rev-card small{display:block;color:var(--m);font-size:11px}
.rev-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rev-chart{display:flex;align-items:flex-end;gap:5px;height:150px;padding:12px 4px 0;border-bottom:1px solid var(--bd);overflow:hidden}
.rev-bar-wrap{height:100%;flex:1;min-width:4px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.rev-bar{width:100%;max-width:18px;min-height:2px;background:linear-gradient(180deg,#78977D,#164E3B);border-radius:5px 5px 1px 1px}
.rev-bar-wrap small{font-size:9px;color:var(--m);white-space:nowrap}
.rev-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--m);margin-top:10px}
.rev-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#164E3B;margin-right:5px}
.rev-table{width:100%;border-collapse:collapse;font-size:12px}
.rev-table th,.rev-table td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--bd);vertical-align:top}
.rev-table th{color:var(--m);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.rev-table td.amount{font-weight:800;color:var(--forest);white-space:nowrap}
.rev-table-wrap{overflow-x:auto}
.rev-empty{padding:16px;color:var(--m);font-size:12px;text-align:center}
.disclaimer{margin-top:22px;border-top:1px solid var(--bd);padding:14px 4px 24px;color:var(--m);font-size:11px;line-height:1.6}
@media(max-width:620px){.revenue-grid{grid-template-columns:1fr 1fr}.rev-card:last-child{grid-column:1/-1}.revenue-hero{padding:17px}.rev-table{min-width:560px}.rev-chart{height:125px}}

<body><header>SHAM<b>LOKO</b> ADMIN</header><main id="a">Loading…</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const db=supabase.createClient('https://arfsggndgyezukwuvmad.supabase.co','sb_publishable_Wso8pBQlyjISd5Qqv-FqyQ_J0fQSHor');
const $=s=>document.querySelector(s),A=$('#a'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=n=>'K'+Number(n||0).toLocaleString('en-US'),pc=(a,b)=>b?Math.round(a/b*100)+'%':'0%',N=x=>Number(x||0);
let tab='Dashboard';const TABS=['Dashboard','Users','Jobs','Bulk Upload','Payments','Verification','Reports'];
const kp=(l,v)=>`<div class="k"><span class="sm">${l}</span><b>${v}</b></div>`;
const bars=(a,key,val,f=x=>x)=>{const m=Math.max(1,...a.map(x=>N(x[val])));return a.map(x=>`<div class="br"><span>${esc(x[key])}</span><i style="width:${N(x[val])/m*100}%"></i><em>${f(x[val])}</em></div>`).join('')||'<div class="sm">No data yet</div>';};
async function boot(){
  A.innerHTML='<div class="card">Checking your administrator access…</div>';
  const {data:{session}}=await db.auth.getSession();
  if(!session){A.innerHTML='<div class="card"><h3>Administrator sign-in required</h3><p class="sm">Sign in to SHAMLOKO with the account that has been granted administrator access, then return to this page.</p><a href="index.html" style="color:#164E3B;font-weight:700">Go to SHAMLOKO sign in</a></div>';return;}
  const {error}=await db.rpc('admin_stats');
  if(error){A.innerHTML='<div class="card"><h3>Admin access not enabled for this account</h3><p class="sm">Your account is signed in, but the database has not authorized it as an administrator. A four-digit code in this page cannot safely grant access to payment approvals or user records.</p><a href="index.html" style="color:#164E3B;font-weight:700">Return to SHAMLOKO</a></div>';return;}
  show();
}
function show(){A.innerHTML=`<div class="tabs">${TABS.map(t=>`<button class="${t==tab?'on':''}" data-t="${t}">${t}</button>`).join('')}</div><button id="adminSignOut" class="r">Sign out</button><div id="v">Loading…</div><div class="disclaimer">Administrator access is verified by Supabase. Payment approvals and other administrative actions remain protected by database permissions. Revenue figures include only approved individual application payments and confirmed membership transactions; pending, rejected and simulated payments are excluded.</div>`;
  $('#adminSignOut').onclick=async()=>{await db.auth.signOut();boot();};
  A.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;show();});({Dashboard:dash,Users:users,Jobs:jobs,'Bulk Upload':bulkUpload,Payments:pays,Verification:verifs,Reports:reports})[tab]();}
const act=async(p,msg)=>{if(msg&&!confirm(msg))return;const {error}=await p;error?alert(error.message):show();};
function moneyBars(rows,key,value){
  const max=Math.max(1,...rows.map(x=>N(x[value])));
  return rows.map(x=>`<div class="br"><span>${esc(x[key])}</span><i style="width:${Math.max(0,N(x[value])/max*100)}%"></i><em>${K(x[value])}</em></div>`).join('')||'<div class="sm">No data yet</div>';
}
function revenueTransactions(rows,filter){
  const filtered=(rows||[]).filter(r=>filter==='all'||r.category===filter);
  if(!filtered.length)return '<div class="rev-empty">No confirmed transactions in this category yet.</div>';
  return `<div class="rev-table-wrap"><table class="rev-table"><thead><tr><th>Paid</th><th>Customer / item</th><th>Category</th><th>Method / reference</th><th>Amount</th></tr></thead><tbody>${filtered.map(r=>`<tr><td>${r.paid_at?new Date(r.paid_at).toLocaleString(): '—'}</td><td><b>${esc(r.user_name)}</b><br><span class="sm">${esc(r.item_label)}</span></td><td>${esc(r.category_label)}</td><td>${esc(r.method)}<br><span class="sm">${esc(r.reference||'No reference')}</span></td><td class="amount">${K(r.amount_zmw)}</td></tr>`).join('')}</tbody></table></div>`;
}
function dailyRevenueChart(rows){
  const max=Math.max(1,...rows.map(x=>N(x.total)));
  return `<div class="rev-chart">${rows.map((r,i)=>{const h=Math.max(2,N(r.total)/max*100);const d=new Date(r.day+'T12:00:00');return `<div class="rev-bar-wrap" title="${esc(r.day)} · ${K(r.total)}"><div class="rev-bar" style="height:${h}%"></div><small>${i%5===0||i===rows.length-1?d.getDate():''}</small></div>`;}).join('')}</div><div class="rev-legend"><span><i class="rev-dot"></i>Daily confirmed revenue · last 30 days</span></div>`;
}
function monthlyRevenueChart(rows){
  const max=Math.max(1,...rows.map(x=>N(x.total)));
  return `<div class="rev-chart">${rows.map((r,i)=>{const h=Math.max(2,N(r.total)/max*100);const d=new Date(r.month+'-15T12:00:00');return `<div class="rev-bar-wrap" title="${esc(r.month)} · ${K(r.total)}"><div class="rev-bar" style="height:${h}%"></div><small>${d.toLocaleDateString(undefined,{month:'short'})}</small></div>`;}).join('')}</div><div class="rev-legend"><span><i class="rev-dot"></i>Monthly confirmed revenue · last 12 months</span></div>`;
}
async function dash(){
  const [{data:d,error},{data:rev,error:revErr}]=await Promise.all([
    db.rpc('admin_stats'),
    db.rpc('admin_revenue_dashboard')
  ]);
  if(error)return $('#v').innerHTML=esc(error.message);
  const s=rev?.summary||{};
  const tx=rev?.transactions||[];
  $('#v').innerHTML=`
  <h3>Revenue overview</h3>
  ${revErr?`<div class="card"><b>Revenue dashboard SQL is not installed yet.</b><p class="sm">${esc(revErr.message)}<br>Run the accompanying SHAMLOKO admin revenue SQL migration in Supabase, then refresh this page.</p></div>`:`
  <div class="revenue-hero">
    <div class="eyebrow">Total confirmed earnings</div>
    <div class="total">${K(s.total)}</div>
    <div class="hero-meta"><div><span>Today</span><b>${K(s.today)}</b></div><div><span>This month</span><b>${K(s.month)}</b></div><div><span>Confirmed payments</span><b>${N(s.count_total).toLocaleString()}</b></div></div>
  </div>
  <div class="revenue-grid" style="margin-top:10px">
    <button class="rev-card" data-revenue="application"><span class="rev-label">Individual applications</span><strong>${K(s.applications)}</strong><small>${N(s.count_applications)} confirmed · K1 application fee</small></button>
    <button class="rev-card" data-revenue="light"><span class="rev-label">Light memberships</span><strong>${K(s.light)}</strong><small>${N(s.count_light)} confirmed · K9.00 plan</small></button>
    <button class="rev-card" data-revenue="pro"><span class="rev-label">Pro memberships</span><strong>${K(s.pro)}</strong><small>${N(s.count_pro)} confirmed · K19.99 plan</small></button>
  </div>
  ${N(s.other_membership)>0?`<div class="card sm">Other confirmed membership transactions: <b>${K(s.other_membership)}</b>. These are included in total earnings but are not classified as Light or Pro.</div>`:''}
  <div class="card"><div class="rev-head"><b>Daily earnings</b><span class="sm">ZMW · Lusaka time</span></div>${dailyRevenueChart(rev.daily||[])}</div>
  <div class="card"><div class="rev-head"><b>Monthly earnings</b><span class="sm">Last 12 months</span></div>${monthlyRevenueChart(rev.monthly||[])}</div>
  <div class="card" id="revenueDetail"><div class="rev-head"><b>Recent confirmed transactions</b><span class="sm">Latest 250</span></div><div style="margin-top:10px">${revenueTransactions(tx,'all')}</div></div>
  `}
  <h3>Users</h3><div class="grid">${kp('Total users',d.users)}${kp('New (7 days)',d.users_7d)}${kp('New (30 days)',d.users_30d)}${kp('Verified',d.verified+' ('+pc(d.verified,d.users)+')')}${kp('Suspended',d.suspended)}</div>
  <h3>Marketplace</h3><div class="grid">${kp('Jobs posted',d.jobs)}${kp('Active jobs',d.active_jobs)}${kp('Active value',K(d.active_value))}${kp('Completed',d.completed_jobs)}${kp('Completed value',K(d.completed_value))}${kp('Completion rate',pc(d.completed_jobs,d.jobs))}${kp('Cancelled',d.cancelled_jobs)}${kp('Expired',d.expired_jobs)}${kp('Official jobs',d.official_jobs)}${kp('Virtual jobs',d.virtual_jobs)}</div>
  <h3>Engagement</h3><div class="grid">${kp('Applications',d.applications)}${kp('Applicants per job',d.jobs?(d.applications/d.jobs).toFixed(1):0)}${kp('Job views',d.views)}${kp('Comments',d.comments)}${kp('Likes',d.likes)}${kp('Saves',d.saves)}${kp('Messages',d.messages)}${kp('Searches',d.searches)}</div>
  <h3>Platform activity and action needed</h3><div class="grid">${kp('Active plans',d.subs_active)}${kp('Paid conversion',pc(d.subs_active,d.users))}${kp('Payments to approve',d.pending_subs)}${kp('Verifications pending',d.pending_verif)}${kp('Open reports',d.open_reports)}</div>
  <h3>Top 10 searches</h3><div class="card">${bars(d.top_searches,'term','n')}</div><h3>Top 10 most viewed jobs</h3><div class="card">${bars(d.top_viewed,'title','n')}</div>
  <h3>Jobs by category</h3><div class="card">${bars(d.by_category,'name','n')}</div><h3>Opportunity value by category</h3><div class="card">${bars(d.by_category,'name','value',K)}</div>
  <h3>Opportunity value by province</h3><div class="card">${bars(d.by_province,'name','value',K)}</div><h3>Users by province</h3><div class="card">${bars(d.users_by_province,'name','n')}</div>
  <h3>Jobs per day (14 days)</h3><div class="card">${bars(d.jobs_per_day,'day','n')}</div><h3>Sign-ups per day (14 days)</h3><div class="card">${bars(d.signups_per_day,'day','n')}</div>`;
  if(!revErr){
    $('#v').querySelectorAll('[data-revenue]').forEach(b=>b.onclick=()=>{
      const filter=b.dataset.revenue;
      $('#v').querySelectorAll('[data-revenue]').forEach(x=>x.classList.toggle('selected',x===b));
      const labels={application:'Individual application transactions',light:'Light membership transactions',pro:'Pro membership transactions'};
      const detail=$('#revenueDetail');
      detail.innerHTML=`<div class="rev-head"><b>${labels[filter]}</b><button class="alt" id="showAllRevenue">Show all</button></div><div style="margin-top:10px">${revenueTransactions(tx,filter)}</div>`;
      $('#showAllRevenue').onclick=()=>{detail.innerHTML=`<div class="rev-head"><b>Recent confirmed transactions</b><span class="sm">Latest 250</span></div><div style="margin-top:10px">${revenueTransactions(tx,'all')}</div>`;$('#v').querySelectorAll('[data-revenue]').forEach(x=>x.classList.remove('selected'));};
      detail.scrollIntoView({behavior:'smooth',block:'start'});
    });
  }
}
async function users(){
  const {data}=await db.from('profiles').select('id,full_name,email,phone,verification_status,suspended,posts_created,applications_made,created_at').order('created_at',{ascending:false}).limit(300);
  const draw=q=>{$('#ul').innerHTML=(data||[]).filter(u=>(u.full_name+(u.email||'')+(u.phone||'')).toLowerCase().includes(q)).map(u=>`<div class="card"><b>${esc(u.full_name)}</b> ${u.suspended?'<span class="sm">(suspended)</span>':''}<div class="sm">${esc(u.email||'')} · ${esc(u.phone||'')} · ${esc(u.verification_status)} · posts ${u.posts_created} · applications ${u.applications_made} · joined ${new Date(u.created_at).toLocaleDateString()}</div><button data-s="${u.id}" data-on="${!u.suspended}">${u.suspended?'Unsuspend':'Suspend'}</button> <button class="r" data-d="${u.id}">Delete user</button></div>`).join('');
    A.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>act(db.rpc('admin_set_suspended',{p_user:b.dataset.s,p_on:b.dataset.on=='true'})));
    A.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>act(db.rpc('admin_delete_user',{p_user:b.dataset.d}),'Permanently delete this user and all their jobs, applications and records? This cannot be undone.'));};
  $('#v').innerHTML='<input id="uq" placeholder="Search users"><div id="ul"></div>';draw('');$('#uq').oninput=e=>draw(e.target.value.toLowerCase());
}

  const {data}=await db.from('jobs').select('id,title,budget_zmw,status,classification,created_at,applicant_count,view_count,profiles!poster_id(full_name)').is('deleted_at',null).order('created_at',{ascending:false}).limit(200);
  $('#v').innerHTML=(data||[]).map(j=>`<div class="card"><b>${esc(j.title)}</b> ${K(j.budget_zmw)}<div class="sm">${esc(j.status)} · ${esc(j.classification)} · by ${esc(j.profiles?.full_name)} · ${j.applicant_count} applicants · ${j.view_count} views · ${new Date(j.created_at).toLocaleDateString()}</div><button class="r" data-j="${j.id}">Delete post</button></div>`).join('')||'<div class="card sm">No jobs.</div>';
  A.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>act(db.rpc('admin_delete_job',{p_job:b.dataset.j}),'Delete this post?'));
}
async function pays(){
  const [{data:subs},{data:apps,error:appErr}]=await Promise.all([
    db.from('subscription_requests').select('*,profiles!user_id(full_name,phone)').order('created_at',{ascending:false}).limit(100),
    db.rpc('admin_list_application_payment_requests')
  ]);
  let html='<div class="card sm">Verify each transaction in your MTN or Airtel mobile money records before approving. Approving a K1 payment unlocks the application form for that applicant. Monthly membership approval activates the selected 30-day plan.</div><h3>Job application payments</h3>';
  if(appErr)html+='<div class="card sm">Application payment queue: '+esc(appErr.message)+'. Run the SHAMLOKO payments SQL migration first.</div>';

  html+='<h3>Monthly memberships</h3><div class="card sm">Light (plan ID: lite): K9.00 for 30 days and 20 applications. Pro (plan ID: pro): K19.99 for 30 days and unlimited applications.</div>'+(subs||[]).map(r=>`<div class="card"><b>${esc(r.profiles?.full_name)}</b> · ${esc(r.plan)}<div class="sm">Network: ${esc(r.network)} · Transaction ID: <b>${esc(r.reference)}</b> · ${esc(r.profiles?.phone||'')} · ${new Date(r.created_at).toLocaleString()} · ${esc(r.status)}</div>${r.status=='pending'?`<button class="g" data-a="${r.id}">Approve</button> <button class="r" data-r="${r.id}">Reject</button>`:''}</div>`).join('');
  $('#v').innerHTML=html;
  A.querySelectorAll('[data-appapprove]').forEach(b=>b.onclick=()=>{if(confirm('Verify the payment and submit this job application?'))act(db.rpc('admin_review_application_payment',{p_request:b.dataset.appapprove,p_approve:true}));});
  A.querySelectorAll('[data-appreject]').forEach(b=>b.onclick=()=>{if(confirm('Reject this payment request?'))act(db.rpc('admin_review_application_payment',{p_request:b.dataset.appreject,p_approve:false}));});
  A.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(db.rpc('admin_review_sub',{p_req:b.dataset.a,p_ok:true})));A.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>act(db.rpc('admin_review_sub',{p_req:b.dataset.r,p_ok:false})));
}

// AI-assisted bulk vacancy upload. Extraction runs in a protected Supabase Edge Function;
// publishing happens only after the administrator reviews and selects individual jobs.
let bulkCategories=[],bulkDistricts=[],bulkDrafts=[];
async function bulkUpload(){
  $('#v').innerHTML=`<h3>AI bulk job upload</h3>
    <div class="card"><b>Upload vacancy documents</b><p class="sm">Upload PDF, Word (.docx) or Excel (.xlsx/.xls) files. One document can contain several vacancies. AI will separate them and prepare editable drafts. Nothing is published during extraction.</p>
    <input id="bulkFiles" type="file" accept=".pdf,.docx,.xlsx,.xls" multiple style="padding:8px;background:#fff">
    <button class="g" id="bulkExtract">Extract vacancies with AI</button><div id="bulkStatus" class="sm" style="margin-top:8px"></div></div>
    <div id="bulkReview"></div>`;
  const [cats,dists]=await Promise.all([
    db.from('categories').select('id,name').order('name'),
    db.from('districts').select('id,name,province_id').order('name')
  ]);
  if(cats.error||dists.error){$('#bulkStatus').textContent='Could not load category/district reference lists: '+(cats.error?.message||dists.error?.message);return;}
  bulkCategories=cats.data||[];bulkDistricts=dists.data||[];
  $('#bulkExtract').onclick=extractBulkJobs;
}
async function extractBulkJobs(){
  const files=[...($('#bulkFiles').files||[])],status=$('#bulkStatus'),btn=$('#bulkExtract');
  if(!files.length){status.textContent='Choose at least one PDF, Word or Excel document first.';return;}
  const allowed=/\.(pdf|docx|xlsx|xls)$/i;
  const bad=files.find(f=>!allowed.test(f.name));if(bad){status.textContent='Unsupported file: '+bad.name+'. Use PDF, DOCX, XLSX or XLS.';return;}
  if(files.some(f=>f.size>15*1024*1024)||files.reduce((n,f)=>n+f.size,0)>30*1024*1024){status.textContent='Files are too large. Maximum 15 MB per file and 30 MB total.';return;}
  btn.disabled=true;btn.textContent='Extracting…';status.textContent='Reading documents and separating vacancies. This may take a moment.';
  try{
    const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('Your session has expired. Sign in again.');
    const fd=new FormData();files.forEach(f=>fd.append('files',f,f.name));
    fd.append('categories',JSON.stringify(bulkCategories));fd.append('districts',JSON.stringify(bulkDistricts));
    const response=await fetch('https://arfsggndgyezukwuvmad.supabase.co/functions/v1/admin-bulk-job-extract',{method:'POST',headers:{Authorization:'Bearer '+session.access_token},body:fd});
    const payload=await response.json().catch(()=>({error:'The extraction service returned an unreadable response.'}));
    if(!response.ok)throw new Error(payload.error||('Extraction failed ('+response.status+').'));
    bulkDrafts=(payload.jobs||[]).map((j,i)=>({...j,_selected:true,_index:i}));
    status.textContent=`AI found ${bulkDrafts.length} vacancy draft(s). Review every field and correct anything highlighted before publishing.`;
    renderBulkReview();
  }catch(e){status.textContent=e.message||'Could not extract these documents.';}
  finally{btn.disabled=false;btn.textContent='Extract vacancies with AI';}
}
function bulkField(i,key,label,value,type='text',extra=''){
  const val=value==null?'':String(value);
  return `<label class="sm" style="display:block;margin-top:8px">${label}<input data-bi="${i}" data-field="${key}" type="${type}" value="${esc(val)}" ${extra} style="margin:3px 0"></label>`;
}
function renderBulkReview(){
  const root=$('#bulkReview');if(!root)return;
  if(!bulkDrafts.length){root.innerHTML='<div class="card sm">No vacancies were extracted.</div>';return;}
  root.innerHTML=`<div class="card"><b>Review extracted vacancies</b><p class="sm">Select the jobs you want to publish. Red warnings indicate missing or uncertain information. Application fees, if found in the source, are shown for your reference only; the current jobs table has no application-fee field.</p><button class="alt" id="bulkSelectAll">Select all</button> <button class="alt" id="bulkSelectNone">Select none</button> <button class="g" id="bulkPublish">Publish selected jobs</button><span id="bulkPublishStatus" class="sm"></span></div>`+
  bulkDrafts.map((j,i)=>{
    const warnings=[...(j.missing_fields||[]).map(x=>'Missing: '+x),...(j.uncertain_fields||[]).map(x=>'Check: '+x)];
    const catOptions='<option value="">Choose category</option>'+bulkCategories.map(c=>`<option value="${c.id}" ${String(j.category_id||'')===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('');
    const distOptions='<option value="">Choose district</option>'+bulkDistricts.map(d=>`<option value="${d.id}" ${String(j.district_id||'')===String(d.id)?'selected':''}>${esc(d.name)}</option>`).join('');
    const needs=j.arrangement==='physical';
    return `<div class="card" data-bulk-card="${i}"><label style="display:flex;gap:8px;align-items:center"><input data-bi="${i}" data-field="_selected" type="checkbox" ${j._selected?'checked':''} style="width:auto;margin:0"><b>Vacancy ${i+1}</b></label>
      ${warnings.length?`<div class="card" style="background:#fff2e9;border-color:#d99b72;color:#85451f"><b>Needs attention</b><div class="sm">${warnings.map(esc).join(' · ')}</div></div>`:'<div class="sm">No missing fields were flagged by AI. Still review before publishing.</div>'}
      ${bulkField(i,'title','Job title',j.title,'text','maxlength="120"')}
      <label class="sm" style="display:block;margin-top:8px">Description<textarea data-bi="${i}" data-field="description" rows="4" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px">${esc(j.description||'')}</textarea></label>
      <label class="sm" style="display:block;margin-top:8px">Requirements (optional)<textarea data-bi="${i}" data-field="requirements" rows="3" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px">${esc(j.requirements||'')}</textarea></label>
      ${bulkField(i,'budget_zmw','Budget / salary (ZMW)',j.budget_zmw,'number','min="0.01" step="0.01"')}
      <label class="sm" style="display:block;margin-top:8px">Category<select data-bi="${i}" data-field="category_id" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px">${catOptions}</select></label>
      <label class="sm" style="display:block;margin-top:8px">Opportunity type<select data-bi="${i}" data-field="opportunity_type" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px"><option value="">Choose type</option>${['one_time','recurring','temporary','permanent','freelance','contract'].map(x=>`<option ${j.opportunity_type===x?'selected':''} value="${x}">${x.replace('_',' ')}</option>`).join('')}</select></label>
      <label class="sm" style="display:block;margin-top:8px">Arrangement<select data-bi="${i}" data-field="arrangement" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px"><option value="">Choose arrangement</option><option value="physical" ${j.arrangement==='physical'?'selected':''}>Physical</option><option value="virtual" ${j.arrangement==='virtual'?'selected':''}>Virtual</option></select></label>
      <label class="sm" style="display:block;margin-top:8px">District (required for physical jobs)<select data-bi="${i}" data-field="district_id" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px">${distOptions}</select></label>
      ${bulkField(i,'location_detail','More specific location (optional)',j.location_detail)}
      <label class="sm" style="display:block;margin-top:8px">Payment type<select data-bi="${i}" data-field="payment_type" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px">${['per_task','hourly','daily','weekly','monthly','milestone'].map(x=>`<option value="${x}" ${j.payment_type===x?'selected':''}>${x.replace('_',' ')}</option>`).join('')}</select></label>
      ${bulkField(i,'positions_needed','Number of people needed',j.positions_needed||j.workers_needed||1,'number','min="1" max="500" step="1"')}
      ${bulkField(i,'deadline','Application deadline',j.deadline,'date')}
      ${bulkField(i,'start_date','Start date (optional)',j.start_date,'date')}
      ${bulkField(i,'completion_date','Completion date (optional)',j.completion_date,'date')}
      <label class="sm" style="display:block;margin-top:8px">Classification<select data-bi="${i}" data-field="classification" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px"><option value="unofficial" ${j.classification!=='official'?'selected':''}>Unofficial</option><option value="official" ${j.classification==='official'?'selected':''}>Official</option></select></label>
      <label class="sm" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input data-bi="${i}" data-field="negotiable" type="checkbox" ${j.negotiable?'checked':''} style="width:auto;margin:0"> Budget is negotiable</label>
      ${j.employer_name?`<div class="sm" style="margin-top:8px">Employer in source: <b>${esc(j.employer_name)}</b></div>`:''}
      ${j.application_fee_note?`<div class="card sm"><b>Application fee mentioned in source:</b> ${esc(j.application_fee_note)}<br>This is not saved as salary or job budget.</div>`:''}
      ${j.source_excerpt?`<details class="sm"><summary>Source excerpt</summary><p>${esc(j.source_excerpt)}</p></details>`:''}
      <div class="sm">Source: ${esc(j.source_file||'Uploaded document')}</div></div>`;
  }).join('');
  root.querySelectorAll('[data-bi]').forEach(el=>el.addEventListener('change',()=>{
    const i=Number(el.dataset.bi),key=el.dataset.field;
    bulkDrafts[i][key]=key==='_selected'?el.checked:(key==='negotiable'?el.checked:el.value);
    if(key==='arrangement'){renderBulkReview();}
  }));
  $('#bulkSelectAll').onclick=()=>{bulkDrafts.forEach(x=>x._selected=true);renderBulkReview();};
  $('#bulkSelectNone').onclick=()=>{bulkDrafts.forEach(x=>x._selected=false);renderBulkReview();};
  $('#bulkPublish').onclick=publishBulkJobs;
}
async function publishBulkJobs(){
  const chosen=bulkDrafts.filter(j=>j._selected),out=$('#bulkPublishStatus'),btn=$('#bulkPublish');
  if(!chosen.length){out.textContent='Select at least one vacancy.';return;}
  const errors=[];
  chosen.forEach((j,n)=>{
    const i=j._index;const title=String(j.title||'').trim();
    if(title.length<5||title.length>120)errors.push(`Vacancy ${n+1}: title must be 5–120 characters.`);
    if(!String(j.description||'').trim())errors.push(`Vacancy ${n+1}: description is required.`);
    if(!(Number(j.budget_zmw)>0))errors.push(`Vacancy ${n+1}: enter a budget/salary greater than zero.`);
    if(!j.category_id)errors.push(`Vacancy ${n+1}: choose a category.`);
    if(!['physical','virtual'].includes(j.arrangement))errors.push(`Vacancy ${n+1}: choose physical or virtual.`);
    if(j.arrangement==='physical'&&!j.district_id)errors.push(`Vacancy ${n+1}: choose a district for this physical job.`);
    if(!['one_time','recurring','temporary','permanent','freelance','contract'].includes(j.opportunity_type))errors.push(`Vacancy ${n+1}: choose a valid opportunity type.`);
    if(!['per_task','hourly','daily','weekly','monthly','milestone'].includes(j.payment_type||'per_task'))errors.push(`Vacancy ${n+1}: choose a valid payment type.`);
    const count=Number(j.positions_needed||j.workers_needed||1);if(!Number.isInteger(count)||count<1||count>500)errors.push(`Vacancy ${n+1}: people needed must be between 1 and 500.`);
    if(!j.deadline||new Date(j.deadline+'T23:59:59')<new Date())errors.push(`Vacancy ${n+1}: enter a future application deadline.`);
  });
  if(errors.length){out.textContent=errors.slice(0,5).join(' ')+(errors.length>5?` Plus ${errors.length-5} more issue(s).`: '');return;}
  if(!confirm(`Publish ${chosen.length} selected job(s) under your administrator account? This will make them live on SHAMLOKO.`))return;
  btn.disabled=true;btn.textContent='Publishing…';let done=0;const failed=[];
  try{
    const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('Your session has expired. Sign in again.');
    for(const j of chosen){
      const count=Number(j.positions_needed||j.workers_needed||1);
      const payload={poster_id:session.user.id,title:String(j.title).trim(),description:String(j.description).trim(),requirements:String(j.requirements||'').trim()||null,category_id:Number(j.category_id),budget_zmw:Number(j.budget_zmw),negotiable:!!j.negotiable,opportunity_type:j.opportunity_type,arrangement:j.arrangement,payment_type:j.payment_type||'per_task',district_id:j.arrangement==='virtual'?null:Number(j.district_id),location_detail:String(j.location_detail||'').trim()||null,workers_needed:count,positions_needed:count,deadline:new Date(j.deadline+'T23:59:59').toISOString(),start_date:j.start_date||null,completion_date:j.completion_date||null,classification:j.classification==='official'?'official':'unofficial',status:'applications_open'};
      const {error}=await db.from('jobs').insert(payload);if(error)failed.push(`${j.title}: ${error.message}`);else done++;
    }
    const summary=`Published ${done} of ${chosen.length} selected job(s).`+(failed.length?' Failed: '+failed.join(' | '):'');
    $('#bulkStatus').textContent=summary;
    if(done){bulkDrafts=bulkDrafts.filter(j=>!j._selected||failed.some(x=>x.startsWith(j.title+':')));renderBulkReview();const nextStatus=$('#bulkPublishStatus');if(nextStatus)nextStatus.textContent=summary;}else out.textContent=summary;
  }catch(e){out.textContent=e.message||'Publishing failed.';}
  finally{btn.disabled=false;btn.textContent='Publish selected jobs';}
}

async function reports(){
  const {data}=await db.from('reports').select('*,jobs(id,title),profiles!reporter_id(full_name)').order('created_at',{ascending:false}).limit(100);
  $('#v').innerHTML=(data||[]).map(r=>`<div class="card"><b>${esc(r.jobs?.title||'(deleted job)')}</b> · ${esc(r.status)}<div class="sm">Reported by ${esc(r.profiles?.full_name)}: ${esc(r.reason)}</div>${r.status=='open'?`${r.jobs?`<button class="r" data-j="${r.jobs.id}">Delete post</button> `:''}<button data-x="${r.id}">Mark resolved</button>`:''}</div>`).join('')||'<div class="card sm">No reports.</div>';
  A.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>act(db.rpc('admin_delete_job',{p_job:b.dataset.j}),'Delete this post?'));A.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>act(db.rpc('admin_resolve_report',{p_id:b.dataset.x})));
}
