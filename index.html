    qt.forEach(t=>{if(ti.some(x=>same(x,t)))sc+=6;else if(ca.some(x=>same(x,t)))sc+=4;else if(de.some(x=>same(x,t)))sc+=2.5;});

async function chat(jobId,other){

      $('#sendPlanRequest').onclick=async()=>{const ref=$('#planReference').value.trim();if(ref.length<5)return $('#planMsg').textContent='Enter the transaction ID.';const {error}=await db.from('subscription_requests').insert({user_id:p.id,plan,network:$('#planNetwork').value,reference:ref});$('#planMsg').textContent=error?error.message:'Submitted. Membership will activate after payment approval.';if(!error)$('#sendPlanRequest').disabled=true;};
    });
  }else if(pt=='Photos'){
    const {data:photos,error}=await db.from('profile_posts').select('id,caption,image_url,created_at').eq('user_id',p.id).order('created_at',{ascending:false});
    pb.innerHTML=`<div class="card"><b>Share a photo</b><input id="profileImage" type="file" accept="image/*"><textarea id="photoCaption" placeholder="Write a caption…"></textarea><button id="publishPhoto">Post to profile</button><div class="sm">Photos you post appear in your public profile catalogue.</div></div>`+(error?`<div class="card err">${esc(error.message)}. Run the profile social features SQL migration.</div>`:(photos||[]).length?`<div class="photo-grid">${photos.map(x=>`<div><img class="photo-tile" src="${esc(x.image_url)}" alt="${esc(x.caption||'Profile photo')}"><div class="sm">${esc(x.caption||'')}</div></div>`).join('')}</div>`:'<div class="card sm">Your photo catalogue is empty. Add your first photo above.</div>');
    $('#publishPhoto').onclick=async()=>{const f=$('#profileImage').files[0];if(!f)return alert('Choose a photo first.');if(!f.type.startsWith('image/')||f.size>5e6)return alert('Choose an image under 5 MB.');const path=p.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_');const up=await db.storage.from('profile-photos').upload(path,f,{contentType:f.type});if(up.error)return alert(up.error.message);const url=db.storage.from('profile-photos').getPublicUrl(path).data.publicUrl;const ins=await db.from('profile_posts').insert({user_id:p.id,caption:$('#photoCaption').value.trim()||null,image_url:url});if(ins.error)return alert(ins.error.message);profileView();};
  }else if(pt=='Qualifications'){
    const {data}=await db.from('qualifications').select('*').eq('user_id',p.id).order('created_at',{ascending:false});
    pb.innerHTML=`<div class="card"><b>Add a qualification</b><input id="qt" placeholder="Title (e.g. Diploma in Electrical Engineering)"><input id="qi" placeholder="Institution (optional)"><input id="qf" type="file" accept="image/*,application/pdf"><button id="qs">Upload</button><div class="sm">Private: only you can open these files. They are not verified yet.</div></div>`+((data||[]).map(q=>`<div class="card"><b>${esc(q.title)}</b><div class="sm">${esc(q.institution||'')} · ${esc(q.status)}</div><div class="row"><button class="alt" data-v="${q.file_path}">View</button><button class="alt" data-d="${q.id}" data-p="${q.file_path}">Delete</button></div></div>`).join('')||'<div class="card sm">No qualifications uploaded yet.</div>');
    $('#qs').onclick=async()=>{const f=$('#qf').files[0],t=$('#qt').value.trim();if(!t||!f)return alert('Add a title and choose a file');if(f.size>5e6)return alert('File must be under 5 MB');
      const path=p.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_'),{error}=await db.storage.from('qualifications').upload(path,f,{contentType:f.type});if(error)return alert(error.message);
      const r=await db.from('qualifications').insert({user_id:p.id,title:t,institution:$('#qi').value.trim()||null,file_path:path});r.error?alert(r.error.message):profileView();};
    pb.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const {data:u}=await db.storage.from('qualifications').createSignedUrl(b.dataset.v,60);u&&window.open(u.signedUrl,'_blank');});
    pb.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this file?'))return;await db.storage.from('qualifications').remove([b.dataset.p]);await db.from('qualifications').delete().eq('id',b.dataset.d);profileView();});
  }else{
    pb.innerHTML=`<div class="card"><b>Profile picture</b><input id="pf" type="file" accept="image/*"><button id="photoSave">Update profile picture</button><div class="sm">Choose a clear image under 2 MB.</div></div>
    <div class="card"><b>Change password</b><input id="oldpw" type="password" placeholder="Current password"><input id="newpw" type="password" placeholder="New password (at least 6 characters)"><input id="newpw2" type="password" placeholder="Confirm new password"><button id="changePw">Change password</button><div id="pwmsg" class="sm"></div></div>
    <div class="card"><b>Verification</b><div class="sm">Status: ${esc(p.verification_status)}${p.employer_verified?' · Employer verified':''}. Your ID number and documents are private and never shown to other users.</div><select id="vk"><option value="identity">Identity (NRC)</option><option value="employer">Employer / business</option></select><input id="vn" placeholder="NRC number or company registration number"><input id="vf" type="file" accept="image/*,application/pdf"><button id="vs">Submit for verification</button><div id="vm" class="sm"></div></div>
    <div class="card"><b>Development tools</b><div class="sm">Admin panel access uses the temporary development PIN.</div><button class="alt" id="ad">Open admin panel</button></div><button class="alt" id="out">Sign out</button>`;
    $('#photoSave').onclick=async()=>{const f=$('#pf').files[0];if(!f)return $('#vm').textContent='Choose a photo first.';if(!f.type.startsWith('image/')||f.size>2e6)return alert('Choose an image under 2 MB');const path=p.id+'/avatar';const {error}=await db.storage.from('avatars').upload(path,f,{upsert:true,contentType:f.type});if(error)return alert(error.message);const url=db.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?t='+Date.now();const r=await db.from('profiles').update({photo_url:url}).eq('id',p.id);if(r.error)return alert(r.error.message);p.photo_url=url;profileView();};
    $('#changePw').onclick=async()=>{const old=$('#oldpw').value,n=$('#newpw').value;if(!old||!n)return $('#pwmsg').textContent='Enter your current and new passwords.';if(n.length<6)return $('#pwmsg').textContent='Use at least 6 characters.';if(n!==$('#newpw2').value)return $('#pwmsg').textContent='The new passwords do not match.';const check=await db.auth.signInWithPassword({email:S.user.email,password:old});if(check.error)return $('#pwmsg').textContent='Current password is incorrect.';const {error}=await db.auth.updateUser({password:n});$('#pwmsg').textContent=error?error.message:'Password changed successfully.';if(!error){$('#oldpw').value='';$('#newpw').value='';$('#newpw2').value='';}};
    $('#vs').onclick=async()=>{const f=$('#vf').files[0],n=$('#vn').value.trim();if(!f||!n)return $('#vm').textContent='Add the number and a document.';if(f.size>5e6)return $('#vm').textContent='File must be under 5 MB';
      const path=p.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_'),u=await db.storage.from('verification').upload(path,f,{contentType:f.type});if(u.error)return $('#vm').textContent=u.error.message;
      const {error}=await db.from('verification_requests').insert({user_id:p.id,kind:$('#vk').value,id_number:n,doc_path:path});
      if(!error&&$('#vk').value=='identity'&&['unverified','rejected'].includes(p.verification_status)){await db.from('profiles').update({verification_status:'pending'}).eq('id',p.id);p.verification_status='pending';}
      $('#vm').textContent=error?error.message:'Submitted. We will review it soon.';};
    $('#ad').onclick=()=>{location.href='admin.html';};
    $('#out').onclick=async()=>{S.ch&&db.removeChannel(S.ch);S.ch=null;await db.auth.signOut();S.profile=null;$('#bell').hidden=true;boot();};
  }
}

document.addEventListener('click',e=>{const c=e.target.closest('.job');if(c)jobView(c.dataset.id);});
async function jobView(id){
  app.innerHTML='<div class="card">Loading…</div>';
  const {data:j,error}=await db.from('jobs').select('*,districts(name),categories(name)').eq('id',id).single();
  if(error)return app.innerHTML=`<div class="card err">${esc(error.message)}</div>`;
  const {data:poster}=await db.from('profiles').select('id,full_name,verification_status,photo_url').eq('id',j.poster_id).maybeSingle();
  j.profiles=poster||null;
  const mine=j.poster_id==S.user.id,open=ACTIVE.includes(j.status);
  let h=`<button class="alt" id="bk">← Back</button><div class="card"><div class="job-poster">${avatarMarkup(poster,'lg-avatar')}<div class="poster-meta"><b>${esc(poster?.full_name||'SHAMLOKO member')}${poster?.verification_status=='verified'?' ✓':''}</b><div class="sm">Posted ${timeAgo(j.created_at)}</div></div></div><h3>${esc(j.title)}</h3><div class="big" style="font-size:22px">${K(j.budget_zmw)}</div><span class="tag">${esc(j.status)}</span><span class="tag">${j.classification=='official'?'Official':'Unofficial'}</span><span class="tag">${j.negotiable?'Negotiable':'Fixed price'}</span><span class="tag">${esc(j.districts?.name||'Anywhere in Zambia')}</span><span class="tag">👥 ${Number(j.applicant_count||0)} applicants</span><p>${esc(j.description)}</p>${j.requirements?'<div class="sm">REQUIREMENTS</div><p>'+esc(j.requirements)+'</p>':''}</div>`;
  if(mine){
    const {data:ap,error:appErr}=await db.from('job_applications').select('*,profiles!applicant_id(full_name,verification_status,photo_url,skills,bio)').eq('job_id',id).order('created_at');
    if(appErr){h+='<div class="card err">Could not load applicants: '+esc(appErr.message)+'</div>';}
    const applicantCards=await Promise.all((ap||[]).map(async a=>{
      const {data:quals,error:qerr}=await db.rpc('get_job_applicant_qualifications',{p_application:a.id});
      const qlist=Array.isArray(quals)?quals:[];
      const qhtml=qerr?`<div class="sm err">Qualifications could not be loaded: ${esc(qerr.message)}</div>`:(qlist.length?`<div class="app-quals"><b>Qualifications</b>${qlist.map(q=>`<div class="sm">🎓 ${esc(q.title)}${q.institution?' · '+esc(q.institution):''} · ${esc(q.status||'submitted')}${q.file_path?` <button class="alt mini" data-qfile="${esc(q.file_path)}">View document</button>`:''}</div>`).join('')}</div>`:'<div class="sm">No qualifications uploaded.</div>');
      return `<div class="card applicant-card"><div class="inbox-person">${avatarMarkup(a.profiles,'lg-avatar')}<div><b>${esc(a.profiles?.full_name||'SHAMLOKO member')}</b><div class="sm">${a.profiles?.verification_status==='verified'?'✓ Verified member':'Member'} · ${esc(a.status)}</div></div></div><p>${esc(a.intro||'')}</p>${a.profiles?.bio?`<div class="sm">${esc(a.profiles.bio)}</div>`:''}${a.profiles?.skills?.length?`<div class="sm"><b>Skills:</b> ${a.profiles.skills.map(esc).join(' · ')}</div>`:''}<div class="sm">${a.proposed_price_zmw?'Offer '+K(a.proposed_price_zmw)+' · ':''}${esc(a.estimated_time||'')}</div>${a.portfolio_url?`<div class="sm">Portfolio: <a href="${esc(a.portfolio_url)}" target="_blank" rel="noopener">Open portfolio</a></div>`:''}${qhtml}<button class="alt" data-msg="${a.applicant_id}">Start conversation</button>${a.status==='pending'&&open?`<button data-select="${a.id}">Select this applicant</button><button class="alt" data-rej="${a.id}">Reject</button>`:a.status==='accepted'?'<div class="pn">✓ Selected for this job</div>':''}</div>`;
    }));
    h+='<h3>Applicants · '+(ap||[]).length+'</h3>'+(applicantCards.length?applicantCards.join(''):'<div class="card sm">No applications yet.</div>');
    const nx={assigned:['in_progress','Start work'],in_progress:['completed','Mark completed']}[j.status];
    if(nx)h+=`<button data-st="${nx[0]}">${nx[1]}</button>`;
    if(['published','applications_open','assigned','in_progress'].includes(j.status))h+=`<button class="alt" data-st="cancelled">Cancel job</button>`;
    if(j.status=='completed')h+='<div class="card sm">Payment is settled directly between you and the worker. Off-platform payments are not covered by platform protection.</div>';
  }else if(open){
    const {data:mineApp}=await db.from('job_applications').select('id').eq('job_id',id).eq('applicant_id',S.user.id).maybeSingle();
    h+=mineApp?'<div class="card sm">You have already applied for this job.</div>':`<div class="card" id="apf"><h3>Ready to apply?</h3><p class="sm">Apply for this opportunity. A one-time application costs K1, or choose a monthly Lite or Pro membership for unlimited applications.</p><button id="applyJobBtn">Apply for Job</button><div id="applyPanel"></div></div>`;
  }
  h+=await extras(j,mine);
  app.innerHTML=h;
  bindExtras(j);
  $('#bk').onclick=()=>main();
  const act=async(p,msg)=>{const {error}=await p;error?alert(error.message):jobView(id);};
  app.querySelectorAll('[data-select]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Select this applicant? The job will close to new applications and all other pending applicants will be marked unsuccessful.'))return;
    b.disabled=true;
    const {error}=await db.rpc('select_job_applicant',{p_application:b.dataset.select});
    if(error){alert(error.message);b.disabled=false;return;}
    alert('Applicant selected. The job is now closed to new applications.');
    jobView(id);
  });
  app.querySelectorAll('[data-qfile]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;const {data,error}=await db.storage.from('qualifications').createSignedUrl(b.dataset.qfile,300);
    b.disabled=false;if(error){alert('Could not open qualification document: '+error.message);return;}
    window.open(data.signedUrl,'_blank','noopener');
  });
  app.querySelectorAll('[data-rej]').forEach(b=>b.onclick=()=>act(db.from('job_applications').update({status:'rejected'}).eq('id',b.dataset.rej)));
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>confirm('Are you sure?')&&act(db.rpc('set_job_status',{p_job:id,p_status:b.dataset.st})));
}

async function openApplyPanel(j){
  const host=$('#applyPanel'); if(!host)return;
  const escv=esc;
  host.innerHTML='<div class="card sm">Step 1 of 3 · Checking your plan…</div>';
  const now=new Date().toISOString();
  const [{data:subs,error:subErr},{data:used},{data:approvedReq,error:reqErr}]=await Promise.all([
    db.from('subscriptions').select('id,plan,expires_at').eq('user_id',S.user.id).gt('expires_at',now).order('expires_at',{ascending:false}).limit(1),
    db.from('job_applications').select('id',{count:'exact',head:true}).eq('applicant_id',S.user.id),
    db.from('application_payment_requests').select('id,status,created_at').eq('user_id',S.user.id).eq('job_id',j.id).eq('payment_type','single_application').order('created_at',{ascending:false}).limit(1)
  ]);
  if(subErr||reqErr){host.innerHTML='<div class="card err">Could not check your plan or payment status: '+esc(subErr?.message||reqErr?.message)+'</div>';return;}
  const active=subs?.[0],plan=(active?.plan||'').toLowerCase(),usedCount=used?.count||0;
  const isLite=!!active&&(plan.includes('lite')||plan.includes('light'));
  const isPro=!!active&&plan.includes('pro');
  const approved=approvedReq?.[0]?.status==='approved';
  const pending=approvedReq?.[0]?.status==='pending';
  const canUseMembership=!!active&&(isPro||(isLite&&usedCount<20));
  const renderDetails=(mode)=>{
    host.innerHTML=`<div class="card"><div class="sm">STEP 2 OF 3 · APPLICATION DETAILS</div><div class="pn">${mode==='membership'?'Membership verified — '+(isPro?'Pro: unlimited applications':`Light: ${Math.max(0,20-usedCount)} of 20 applications remaining`):'K1 payment approved for this job'}</div><h3>Tell the poster why you are right for this job</h3><textarea id="appIntro" placeholder="Introduce yourself and your relevant skills"></textarea>${j.negotiable?'<input id="appPrice" type="number" min="1" placeholder="Your proposed price (ZMW)">':''}<input id="appTime" placeholder="Estimated completion time (e.g. 2 days)"><input id="appPortfolio" placeholder="Portfolio link (optional)"><button id="sendApplication">Submit Application</button><div id="applyMsg" class="sm"></div></div>`;
    $('#sendApplication').onclick=async()=>{
      const intro=$('#appIntro').value.trim();if(!intro){$('#applyMsg').textContent='Please add a short introduction.';return;}
      if(S.busy)return;S.busy=true;$('#sendApplication').disabled=true;
      const payload={job_id:j.id,applicant_id:S.user.id,intro,proposed_price_zmw:$('#appPrice')?.value?Number($('#appPrice').value):null,estimated_time:$('#appTime').value.trim()||null,portfolio_url:$('#appPortfolio').value.trim()||null};
      const {error}=await db.from('job_applications').insert(payload);S.busy=false;
      if(error){$('#sendApplication').disabled=false;$('#applyMsg').textContent=error.message;return;}
      host.innerHTML='<div class="card"><div class="sm">STEP 3 OF 3 · COMPLETE</div><h3>✓ Application submitted!</h3><p>You have successfully applied for <b>'+esc(j.title)+'</b>.</p><div class="steps"><b>What happens next</b><br>1. The poster reviews applicants.<br>2. You get a notification when you are accepted or not selected.<br>3. If accepted, you will see the job and amount on your profile, and can start working.</div><p class="sm">Taking you back to the job details…</p><button id="returnJob">Return to this job</button></div>';
      $('#returnJob').onclick=()=>jobView(j.id);await refreshMe();setTimeout(()=>jobView(j.id),1400);
    };
  };
  if(canUseMembership){
    host.innerHTML=`<div class="card"><div class="sm">STEP 1 OF 3 · PAYMENT PLAN</div><h3>Membership recognised</h3><p>${isPro?'Your Pro membership includes unlimited applications.':`Your Light membership includes 20 applications. You have used ${usedCount} and have ${20-usedCount} remaining.`}</p><button id="continueDetails">Continue to application</button></div>`;
    $('#continueDetails').onclick=()=>renderDetails('membership');return;
  }
  if(active&&isLite&&usedCount>=20){host.innerHTML='<div class="card"><div class="sm">STEP 1 OF 3 · PLAN LIMIT REACHED</div><h3>Lite application limit reached</h3><p>You have used all 20 applications included in your active Lite membership. Upgrade to Pro or pay K1 for this application.</p><button id="singleInstead">Pay K1 for this job</button><button class="alt" id="upgradePro">View membership plans</button></div>';$('#singleInstead').onclick=()=>renderPayment();$('#upgradePro').onclick=()=>{S.pt='Plans';S.tab='profile';main();};
  } else if(approved){
    host.innerHTML='<div class="card"><div class="sm">STEP 1 OF 3 · PAYMENT VERIFIED</div><h3>Transaction approved</h3><p>Your K1 payment has been approved. Continue to complete your application.</p><button id="continueDetails">Continue</button></div>';
    $('#continueDetails').onclick=()=>renderDetails('single');return;
  } else if(pending){
    host.innerHTML='<div class="card"><div class="sm">STEP 1 OF 3 · PAYMENT UNDER REVIEW</div><h3>Transaction not approved yet</h3><p>Your K1 payment is awaiting admin approval. This usually takes about 60 minutes. The application form unlocks once it is approved.</p><button class="alt" id="refreshPayment">Check payment status</button><div id="applyMsg" class="sm"></div></div>';
    $('#refreshPayment').onclick=()=>openApplyPanel(j);return;
  } else renderPayment();
  function renderPayment(){
    host.innerHTML=`<div class="card"><div class="sm">STEP 1 OF 3 · CHOOSE PAYMENT PLAN</div><h3>How would you like to apply?</h3><div class="card"><b>Single application</b><div class="big">K1.00</div><p class="sm">One payment for this job only.</p><button id="chooseSingle">Continue with K1</button></div><div class="card"><b>Light membership</b><div class="big">K9.00 <span class="sm">/ 30 days</span></div><p class="sm">Up to 20 job applications during the membership period.</p><button class="alt" id="chooseLite">Choose Light</button></div><div class="card"><b>Pro membership</b><div class="big">K19.99 <span class="sm">/ 30 days</span></div><p class="sm">Unlimited job applications during the membership period.</p><button class="alt" id="choosePro">Choose Pro</button></div><div id="paymentEntry"></div></div>`;
    const membership=(plan,amount)=>{S.pt='Plans';S.tab='profile';main();};
    $('#chooseLite').onclick=()=>membership('lite',9);$('#choosePro').onclick=()=>membership('pro',19.99);
    $('#chooseSingle').onclick=()=>{
      const box=$('#paymentEntry');box.innerHTML=`<div class="card"><b>Pay K1.00 by mobile money</b><div class="pn">MTN: 0964 31 93 21</div><div class="pn">Airtel: 05 72 42 17 74</div><p class="sm">Send K1.00, then enter the transaction ID from your confirmation SMS. Your application form unlocks after admin approval.</p><select id="applyNetwork"><option value="MTN">MTN</option><option value="Airtel">Airtel</option></select><input id="applyReference" placeholder="Mobile money transaction ID"><button id="sendPaymentRequest">Submit payment reference</button><div id="paymentMsg" class="sm"></div></div>`;
      $('#sendPaymentRequest').onclick=async()=>{const ref=$('#applyReference').value.trim();if(ref.length<5)return $('#paymentMsg').textContent='Enter the transaction ID.';if(S.busy)return;S.busy=true;$('#sendPaymentRequest').disabled=true;
        const {error}=await db.from('application_payment_requests').insert({user_id:S.user.id,job_id:j.id,payment_type:'single_application',amount_zmw:1,network:$('#applyNetwork').value,transaction_id:ref,application_data:{}});S.busy=false;
        if(error){$('#sendPaymentRequest').disabled=false;$('#paymentMsg').textContent=error.message;return;}
        host.innerHTML='<div class="card"><div class="sm">STEP 1 OF 3 · PAYMENT SUBMITTED</div><h3>Awaiting payment approval</h3><p>Your transaction reference has been submitted. It is not approved yet. This usually takes about 60 minutes. Return here to check.</p><button id="checkStatus">Check payment status</button></div>';
        $('#checkStatus').onclick=()=>openApplyPanel(j);
      };
    };
  }
}
const FREE=5;
async function refreshMe(){const {data}=await db.from('profiles').select('*').eq('id',S.user.id).single();if(data)S.profile=data;}
function gateMsg(sel,e){const el=$(sel);if(e.message.includes('SUBSCRIPTION_REQUIRED')){el.innerHTML='You have used your free allowance. <a href="#" id="gp">Choose a plan to continue</a>';$('#gp').onclick=ev=>{ev.preventDefault();S.tab='profile';S.pt='Plans';main();};}else el.textContent=e.message.replace('DUPLICATE_LISTING','You already have an active job with this title.').replace('ACCOUNT_SUSPENDED','Your account is suspended.');}

function recoveryView(){
  $('#nav').hidden=true;
  app.innerHTML='<div class="card"><div class="auth-brand">SHAM<b>LOKO</b></div><h3>Set a new password</h3><input id="p1" type="password" placeholder="New password (6+ characters)"><input id="p2" type="password" placeholder="Confirm new password"><button id="sp">Save password</button><div id="msg" class="err"></div></div>';
  $('#sp').onclick=async()=>{const a=$('#p1').value;if(a.length<6)return $('#msg').textContent='Use at least 6 characters.';if(a!=$('#p2').value)return $('#msg').textContent='Passwords do not match.';
    const {error}=await db.auth.updateUser({password:a});if(error)return $('#msg').textContent=error.message;
    REC=false;history.replaceState(null,'',location.pathname);boot();};
}
boot().then(()=>{const m=location.hash.match(/job=([\w-]+)/);if(m&&S.profile)jobView(m[1]);});
