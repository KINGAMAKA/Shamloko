<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHAMLOKO</title>
<style>
:root{--bg:#0f1b2d;--card:#172740;--g:#1faa59;--t:#fff;--m:#9fb0c8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding-bottom:70px}
header{padding:14px 16px;font-weight:800;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center}
header b{color:var(--g)}main{padding:0 16px 16px;max-width:640px;margin:auto}
.card{background:var(--card);border-radius:12px;padding:14px;margin:10px 0}
.big{font-size:28px;font-weight:800;color:var(--g)}.sm{color:var(--m);font-size:12px;letter-spacing:1px}
input,select,textarea,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #2c4062;background:#0c1626;color:var(--t);font:inherit}
button{background:var(--g);border:0;font-weight:700}button.alt{background:#2c4062}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a1322;border-top:1px solid #2c4062}
nav button{background:none;border-radius:0;margin:0;color:var(--m);font-size:13px}nav button.on{color:var(--g)}
nav button.post{color:#fff;background:var(--g)}
.err{color:#ff7b7b}.tag{display:inline-block;background:#0c1626;border-radius:6px;padding:2px 8px;font-size:12px;margin-right:6px;color:var(--m)}
</style></head><body>
<header><span>SHAM<b>LOKO</b></span><span id="loc" class="sm"></span></header>
<main id="app">Loading…</main>
<nav id="nav" hidden></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='PASTE_YOUR_SUPABASE_URL', SUPABASE_ANON_KEY='PASTE_YOUR_ANON_KEY'; // anon key only, never the service key
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=n=>'K'+Number(n||0).toLocaleString('en-US');
const S={user:null,profile:null,prov:[],dist:[],cats:[],tab:'home',busy:false};
const opts=(a,sel)=>a.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.name)}</option>`).join('');
const dOpts=(pid,sel)=>opts(S.dist.filter(d=>d.province_id==pid),sel);

async function boot(){
  const {data:{session}}=await db.auth.getSession();
  const [p,d,c]=await Promise.all([db.from('provinces').select('*').order('name'),db.from('districts').select('*').order('name'),db.from('categories').select('*').eq('active',true).order('name')]);
  S.prov=p.data||[];S.dist=d.data||[];S.cats=c.data||[];
  if(!session) return authView();
  S.user=session.user; await loadProfile();
}
async function loadProfile(){
  const {data}=await db.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  S.profile=data; data?main():setupView();
}
function authView(){
  $('#nav').hidden=true;
  app.innerHTML=`<div class="card"><h2>One person's problem is another person's opportunity</h2>
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)">
  <button id="in">Log in</button><button class="alt" id="up">Create account</button><div id="msg" class="err"></div></div>`;
  const go=async fn=>{const {error}=await fn({email:$('#em').value.trim(),password:$('#pw').value});
    if(error)$('#msg').textContent=error.message;else boot();};
  $('#in').onclick=()=>go(db.auth.signInWithPassword.bind(db.auth));
  $('#up').onclick=()=>go(db.auth.signUp.bind(db.auth));
}
function setupView(){
  $('#nav').hidden=true;
  app.innerHTML=`<div class="card"><h3>Your profile</h3>
  <input id="fn" placeholder="Full name"><input id="ph" placeholder="Phone (e.g. 097...)">
  <textarea id="bio" placeholder="Short bio"></textarea><input id="sk" placeholder="Skills, comma separated">
  <div class="sm">HOME LOCATION</div><select id="hp">${opts(S.prov)}</select><select id="hd"></select>
  <div class="sm">WORKING LOCATION (you can change it later)</div><select id="wp">${opts(S.prov)}</select><select id="wd"></select>
  <button id="sv">Save and continue</button><div id="msg" class="err"></div></div>`;
  const link=(p,d)=>{const f=()=>$(d).innerHTML=dOpts($(p).value);$(p).onchange=f;f();};
  link('#hp','#hd');link('#wp','#wd');
  $('#sv').onclick=async()=>{
    const name=$('#fn').value.trim(); if(!name) return $('#msg').textContent='Enter your full name';
    const {error}=await db.from('profiles').insert({id:S.user.id,full_name:name,phone:$('#ph').value.trim(),email:S.user.email,bio:$('#bio').value.trim(),
      skills:$('#sk').value.split(',').map(s=>s.trim()).filter(Boolean),home_district_id:+$('#hd').value,working_district_id:+$('#wd').value});
    error?$('#msg').textContent=error.message:loadProfile();};
}
function main(){
  const n=$('#nav');n.hidden=false;
  n.innerHTML=[['home','Home'],['explore','Explore'],['post','Post a Job'],['me','Profile']].map(([k,l])=>`<button data-t="${k}" class="${k==S.tab?'on':''} ${k=='post'?'post':''}">${l}</button>`).join('');
  n.onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;main();}};
  const dn=S.dist.find(d=>d.id==S.profile.working_district_id);
  $('#loc').textContent=dn?dn.name.toUpperCase():'';
  ({home:homeView,explore:exploreView,post:postView,me:meView})[S.tab]();
}
const jobCard=j=>`<div class="card"><b>${esc(j.title)}</b><div class="big" style="font-size:20px">${K(j.budget_zmw)}</div>
 <span class="tag">${j.arrangement=='virtual'?'Virtual':'Physical'}</span><span class="tag">${esc(j.categories?.name||'Other')}</span><span class="tag">${esc(j.districts?.name||'Anywhere in Zambia')}</span>
 <div class="sm">Posted ${new Date(j.created_at).toLocaleDateString()}${j.deadline?' · Deadline '+new Date(j.deadline).toLocaleDateString():''}</div></div>`;
const JSEL='id,title,budget_zmw,arrangement,created_at,deadline,districts(name),categories(name)';
const ACTIVE=['published','applications_open'];
async function homeView(){
  app.innerHTML='<div class="card">Loading…</div>';
  const wd=S.profile.working_district_id;
  const [nat,loc,jobs]=await Promise.all([
    db.from('opportunity_value_national').select('*').single(),
    db.from('opportunity_value_by_district').select('*').eq('district_id',wd).maybeSingle(),
    db.from('jobs').select(JSEL).in('status',ACTIVE).is('deleted_at',null).or(`district_id.eq.${wd},arrangement.eq.virtual`).order('created_at',{ascending:false}).limit(20)]);
  const dn=S.dist.find(d=>d.id==wd)?.name||'Your area';
  if(nat.error||jobs.error) return app.innerHTML=`<div class="card err">Network or setup error: ${esc((nat.error||jobs.error).message)}</div>`;
  app.innerHTML=`<div class="card"><div class="sm">ZAMBIA — ACTIVE OPPORTUNITIES</div><div class="big">${K(nat.data.active_value)}</div><div class="sm">${K(nat.data.posted_today)} posted today · ${nat.data.active_jobs} jobs</div></div>
  <div class="card"><div class="sm">${esc(dn.toUpperCase())} — ACTIVE OPPORTUNITIES</div><div class="big">${K(loc.data?.active_value)}</div><div class="sm">${K(loc.data?.posted_today)} posted today</div></div>
  <button id="hire">Need someone? Post a job</button><h3>Opportunities near you</h3>`
  +(jobs.data.length?jobs.data.map(jobCard).join(''):'<div class="card sm">No opportunities in your area yet. Be the first to post one, or browse nationwide in Explore.</div>');
  $('#hire').onclick=()=>{S.tab='post';main();};
}
async function exploreView(){
  app.innerHTML=`<input id="q" placeholder="Search jobs"><select id="c"><option value="">All categories</option>${opts(S.cats)}</select>
  <select id="a"><option value="">Physical & virtual</option><option value="physical">Physical</option><option value="virtual">Virtual</option></select>
  <select id="o"><option value="created_at">Newest</option><option value="budget_zmw">Highest paying</option></select><div id="res"></div>`;
  const run=async()=>{let q=db.from('jobs').select(JSEL).in('status',ACTIVE).is('deleted_at',null);
    if($('#q').value.trim())q=q.ilike('title','%'+$('#q').value.trim().replace(/[%,]/g,'')+'%');
    if($('#c').value)q=q.eq('category_id',$('#c').value);if($('#a').value)q=q.eq('arrangement',$('#a').value);
    const {data,error}=await q.order($('#o').value,{ascending:false}).limit(30);
    $('#res').innerHTML=error?`<div class="err">${esc(error.message)}</div>`:data.length?data.map(jobCard).join(''):'<div class="card sm">No matching opportunities.</div>';};
  ['q','c','a','o'].forEach(i=>$('#'+i).onchange=run);run();
}
function postView(){
  app.innerHTML=`<div class="card"><h3>Post a job or problem</h3>
  <input id="t" placeholder="Title"><textarea id="d" placeholder="Describe what needs doing"></textarea>
  <select id="c">${opts(S.cats)}</select><input id="b" type="number" min="1" placeholder="Budget (ZMW)">
  <select id="ty"><option value="one_time">One-time task</option><option value="recurring">Recurring</option><option value="temporary">Temporary employment</option><option value="permanent">Permanent employment</option><option value="freelance">Freelance project</option><option value="contract">Contract</option></select>
  <select id="ar"><option value="physical">Physical (someone must travel)</option><option value="virtual">Virtual (remote)</option></select>
  <div id="loc2"><select id="p">${opts(S.prov,S.dist.find(d=>d.id==S.profile.working_district_id)?.province_id)}</select><select id="di"></select></div>
  <label class="sm"><input id="ng" type="checkbox" style="width:auto"> Negotiable</label>
  <button id="go">Publish</button><div id="msg" class="err"></div></div>`;
  const cur=S.profile.working_district_id;
  const f=()=>{$('#di').innerHTML=dOpts($('#p').value,cur);};$('#p').onchange=f;f();
  $('#ar').onchange=()=>$('#loc2').hidden=$('#ar').value=='virtual';
  $('#go').onclick=async()=>{
    if(S.busy)return;const t=$('#t').value.trim(),b=+$('#b').value;
    if(t.length<5||!$('#d').value.trim()||!(b>0))return $('#msg').textContent='Add a title (5+ characters), description and budget.';
    S.busy=true;$('#go').textContent='Publishing…';
    const v=$('#ar').value=='virtual';
    const {error}=await db.from('jobs').insert({poster_id:S.user.id,title:t,description:$('#d').value.trim(),category_id:+$('#c').value,budget_zmw:b,
      negotiable:$('#ng').checked,opportunity_type:$('#ty').value,arrangement:$('#ar').value,district_id:v?null:+$('#di').value});
    S.busy=false;$('#go').textContent='Publish';
    if(error)$('#msg').textContent=error.message;else{S.tab='home';main();}};
}
async function meView(){
  const p=S.profile;
  app.innerHTML=`<div class="card"><h3>${esc(p.full_name)}</h3><div class="sm">${esc(p.email||'')} · ${esc(p.verification_status)}</div>
  <p>Free postings used: ${p.posts_created}/5<br>Free applications used: ${p.applications_made}/5</p></div>
  <div class="card"><div class="sm">CHANGE WORKING LOCATION</div><select id="p">${opts(S.prov,S.dist.find(d=>d.id==p.working_district_id)?.province_id)}</select><select id="di"></select>
  <button id="sv">Update location</button></div><button class="alt" id="out">Log out</button>`;
  const f=()=>$('#di').innerHTML=dOpts($('#p').value,p.working_district_id);$('#p').onchange=f;f();
  $('#sv').onclick=async()=>{const {error}=await db.from('profiles').update({working_district_id:+$('#di').value}).eq('id',p.id);
    if(!error){S.profile.working_district_id=+$('#di').value;S.tab='home';main();}};
  $('#out').onclick=async()=>{await db.auth.signOut();S.profile=null;boot();};
}
boot();
</script></body></html>
