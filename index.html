<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHAMLOKO</title>
<style>
:root{--bg:#0f1b2d;--card:#172740;--g:#1faa59;--t:#fff;--m:#9fb0c8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding-bottom:70px}
header{padding:14px 16px;font-weight:800;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a1322;border-top:1px solid #2c4062}

.err{color:#ff7b7b}.tag{display:inline-block;background:#0c1626;border-radius:6px;padding:2px 8px;font-size:12px;margin-right:6px;color:var(--m)}
</style></head><body>
<header><span>SHAM<b>LOKO</b></span><span id="loc" class="sm"></span></header>
<main id="app">Loading…</main>
<nav id="nav" hidden></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://arfsggndgyezukwuvmad.supabase.co', SUPABASE_ANON_KEY='sb_publishable_Wso8pBQlyjISd5Qqv-FqyQ_J0fQSHor'; // anon key only, never the service key
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
</script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=n=>'K'+Number(n||0).toLocaleString('en-US');
const S={user:null,profile:null,prov:[],dist:[],cats:[],tab:'home',profileSection:'overview',busy:false,filter:'all',search:'',category:''};
const ACTIVE=['published','applications_open'];
const JSEL='id,poster_id,title,description,budget_zmw,negotiable,opportunity_type,arrangement,created_at,deadline,status,classification,start_date,completion_date,requirements,employer_name,district_id,category_id,districts(name),categories(name)';
const opts=(a,sel)=>a.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.name)}</option>`).join('');
const dOpts=(pid,sel)=>opts(S.dist.filter(d=>d.province_id==pid),sel);
const dateText=v=>v?new Date(v+'T00:00:00').toLocaleDateString():'Not specified';
const iconFor=n=>({'Construction':'🧱','Agriculture':'🌱','Transport':'🚚','Cleaning':'🧹','Graphic design':'🎨','Technology':'💻','Education':'📚','Other':'✨'}[n]||'✦');

async function boot(){
  $('#nav').hidden=true;app.innerHTML='<div class="card">Loading SHAMLOKO…</div>';
  const {data:{session},error:se}=await db.auth.getSession();
  if(se){app.innerHTML=`<div class="card err">${esc(se.message)}</div>`;return;}
  const [p,d,c]=await Promise.all([db.from('provinces').select('*').order('name'),db.from('districts').select('*').order('name'),db.from('categories').select('*').eq('active',true).order('name')]);
  S.prov=p.data||[];S.dist=d.data||[];S.cats=c.data||[];
  if(!session){S.user=null;S.profile=null;authView();return;}
  S.user=session.user;await loadProfile();
}
async function loadProfile(){
  const {data,error}=await db.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  if(error){app.innerHTML=`<div class="card err">Could not load your profile: ${esc(error.message)}</div>`;return;}
  S.profile=data;
  if(!data){setupView();return;}
  if(S.user.email && data.email!==S.user.email){
    const sync=await db.from('profiles').update({email:S.user.email}).eq('id',S.user.id);
    if(!sync.error)S.profile.email=S.user.email;
  }
  main();
}
function authView(){
  $('#nav').hidden=true;
  app.innerHTML=`<div class="card"><h2>Welcome to SHAMLOKO</h2><p class="sm">One person's problem is another person's opportunity.</p><label>Email</label><input id="em" type="email" autocomplete="email" placeholder="Email address"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Password (6+ characters)"><button id="in">Log in</button><button class="alt" id="up">Create account</button><div id="msg" class="err"></div></div>`;
  const go=async fn=>{const {error}=await fn({email:$('#em').value.trim(),password:$('#pw').value});if(error)$('#msg').textContent=error.message;else boot();};
  $('#in').onclick=()=>go(db.auth.signInWithPassword.bind(db.auth));$('#up').onclick=()=>go(db.auth.signUp.bind(db.auth));
}
function setupView(){
  $('#nav').hidden=true;
  app.innerHTML=`<div class="card"><h2>Set up your profile</h2><label>Full name</label><input id="fn" placeholder="Your full name"><label>Username</label><input id="un" placeholder="Choose a username"><label>Phone</label><input id="ph" placeholder="Phone number"><label>Short bio</label><textarea id="bio" placeholder="Tell people a little about yourself"></textarea><label>Skills (comma separated)</label><input id="sk" placeholder="e.g. plumbing, graphic design"><div class="sm">HOME LOCATION</div><select id="hp">${opts(S.prov)}</select><select id="hd"></select><div class="sm">WORKING LOCATION</div><select id="wp">${opts(S.prov)}</select><select id="wd"></select><button id="sv">Save and continue</button><div id="msg" class="err"></div></div>`;
  const link=(p,d)=>{const f=()=>$(d).innerHTML=dOpts($(p).value);$(p).onchange=f;f();};link('#hp','#hd');link('#wp','#wd');
  $('#sv').onclick=async()=>{const name=$('#fn').value.trim();if(!name)return $('#msg').textContent='Enter your full name.';
    const payload={id:S.user.id,full_name:name,username:$('#un').value.trim()||null,phone:$('#ph').value.trim(),email:S.user.email,bio:$('#bio').value.trim(),skills:$('#sk').value.split(',').map(x=>x.trim()).filter(Boolean),home_district_id:+$('#hd').value,working_district_id:+$('#wd').value};
    const {error}=await db.from('profiles').insert(payload);if(error)$('#msg').textContent=error.message;else loadProfile();};
}
function navView(){
  const n=$('#nav');n.hidden=false;
  const items=[['home','⌂','Home'],['explore','⌕','Explore'],['post','＋','Post a Job'],['me','●','Profile']];
  n.innerHTML=items.map(([k,i,l])=>`<button data-t="${k}" class="${k===S.tab?'on':''} ${k==='post'?'post':''}"><span style="font-size:19px">${i}</span>${l}</button>`).join('');
  n.onclick=e=>{const t=e.target.closest('button')?.dataset.t;if(t){S.tab=t;main();}};
}
function main(){
  navView();const dn=S.dist.find(d=>d.id==S.profile?.working_district_id);$('#loc').textContent=dn?dn.name.toUpperCase():'ZAMBIA';
  const views={home:homeView,explore:exploreView,post:postView,me:meView};(views[S.tab]||homeView)();
}
function jobCard(j){
 return `<div class="card job" data-id="${j.id}"><div class="between"><b>${esc(j.title)}</b><span class="big" style="font-size:20px">${K(j.budget_zmw)}</span></div><div><span class="tag">${j.classification==='official'?'Official':'Unofficial'}</span><span class="tag">${j.arrangement==='virtual'?'Virtual':'Physical'}</span><span class="tag">${esc(j.categories?.name||'Opportunity')}</span></div><div class="sm">${esc(j.districts?.name||'Anywhere in Zambia')} · ${dateText(j.created_at?.slice(0,10))}</div></div>`;
}
async function fetchActive(extra= q=>q){
 let q=db.from('jobs').select(JSEL).in('status',ACTIVE).is('deleted_at',null).order('created_at',{ascending:false}).limit(500);
 return await extra(q);
}
async function homeView(){
 app.innerHTML='<div class="card">Loading opportunities…</div>';
 const wd=S.profile.working_district_id;
 const {data,error}=await fetchActive(q=>q);
 if(error){app.innerHTML=`<div class="card err">Unable to load opportunities: ${esc(error.message)}</div>`;return;}
 const all=data||[],near=all.filter(j=>j.district_id==wd||j.arrangement==='virtual'),sum=all.reduce((n,j)=>n+Number(j.budget_zmw||0),0),nearSum=near.reduce((n,j)=>n+Number(j.budget_zmw||0),0);
 const dn=S.dist.find(d=>d.id==wd)?.name||'Your area',highest=[...all].sort((a,b)=>Number(b.budget_zmw||0)-Number(a.budget_zmw||0)).slice(0,4);
 const section=(title,arr)=>`<div class="sectionhead"><h3>${title}</h3><span class="sm">${arr.length} found</span></div>${arr.length?arr.slice(0,5).map(jobCard).join(''):'<div class="card empty">No opportunities here yet.</div>'}`;
 app.innerHTML=`<h1>Find opportunities.<br><span style="color:var(--green)">Make things happen.</span></h1><input id="homeq" placeholder="⌕  Search jobs, skills or services…"><div class="grid2"><button id="find">Find Work</button><button class="alt" id="hire">Post Work</button></div>
 <div class="grid2"><div class="stat"><div class="sm">ZAMBIA · ACTIVE VALUE</div><strong>${K(sum)}</strong><div class="sm">${all.length} active opportunities loaded</div></div><div class="stat"><div class="sm">${esc(dn.toUpperCase())} · LOCAL VALUE</div><strong>${K(nearSum)}</strong><div class="sm">${near.length} local / virtual opportunities</div></div></div>
 <div class="sectionhead"><h3>Explore categories</h3><span class="sm">Browse all</span></div><div class="catgrid">${S.cats.slice(0,8).map(c=>`<div class="cat" data-cat="${c.id}"><span>${iconFor(c.name)}</span>${esc(c.name)}</div>`).join('')}</div>
 ${section('Latest opportunities',all)}${section('Near you',near)}${section('Highest-paying',highest)}`;
 $('#find').onclick=()=>{S.tab='explore';main();};$('#hire').onclick=()=>{S.tab='post';main();};
 $('#homeq').onkeydown=e=>{if(e.key==='Enter'){S.search=e.target.value;S.tab='explore';main();}};
 app.querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{S.category=x.dataset.cat;S.tab='explore';main();});
}
async function exploreView(){
 app.innerHTML=`<h2>Explore opportunities</h2><input id="q" placeholder="Search jobs, skills or services…" value="${esc(S.search)}"><div class="pills" id="filters">${[['all','All'],['official','Official'],['unofficial','Unofficial'],['virtual','Virtual'],['physical','Physical']].map(([v,l])=>`<button data-f="${v}" class="${S.filter===v?'active':''}">${l}</button>`).join('')}</div>
 <div class="grid2"><select id="c"><option value="">All categories</option>${opts(S.cats,S.category)}</select><input id="maxb" type="number" min="0" placeholder="Maximum budget (K)"></div><div class="grid2"><select id="district"><option value="">All Zambia</option>${opts(S.dist)}</select><select id="sort"><option value="created_at">Newest first</option><option value="budget_zmw">Highest paying</option></select></div><div id="res"><div class="card">Loading…</div></div>`;
 const run=async()=>{let q=db.from('jobs').select(JSEL).in('status',ACTIVE).is('deleted_at',null);const term=$('#q').value.trim().replace(/[%,]/g,'');
  if(term)q=q.or(`title.ilike.%${term}%,description.ilike.%${term}%`);if($('#c').value)q=q.eq('category_id',$('#c').value);if($('#district').value)q=q.eq('district_id',$('#district').value);if($('#maxb').value)q=q.lte('budget_zmw',+$('#maxb').value);
  if(['official','unofficial'].includes(S.filter))q=q.eq('classification',S.filter);if(['virtual','physical'].includes(S.filter))q=q.eq('arrangement',S.filter);
  const {data,error}=await q.order($('#sort').value,{ascending:false}).limit(100);$('#res').innerHTML=error?`<div class="card err">${esc(error.message)}</div>`:data?.length?data.map(jobCard).join(''):'<div class="card empty">No matching opportunities found.</div>';};
 $('#filters').onclick=e=>{const f=e.target.dataset.f;if(f){S.filter=f;exploreView();}};['q','c','maxb','district','sort'].forEach(id=>$('#'+id).onchange=run);$('#q').oninput=()=>{clearTimeout(window._shamlokoSearch);window._shamlokoSearch=setTimeout(run,350);};run();
}
function postView(){
 const cur=S.profile.working_district_id,prov=S.dist.find(d=>d.id==cur)?.province_id;
 app.innerHTML=`<div class="card"><h2>Post a job or problem</h2><label>Title</label><input id="t" placeholder="What needs to be done?"><label>Description</label><textarea id="d" placeholder="Describe what needs doing"></textarea><div class="grid2"><div><label>Classification</label><select id="cl"><option value="unofficial">Unofficial / informal</option><option value="official">Official / formal job</option></select></div><div><label>Work arrangement</label><select id="ar"><option value="physical">Physical</option><option value="virtual">Virtual</option></select></div></div><label>Employer / organisation name</label><input id="employer" placeholder="Optional"><label>Category</label><select id="c">${opts(S.cats)}</select><div class="grid2"><div><label>Budget (ZMW)</label><input id="b" type="number" min="1" placeholder="Budget"></div><div><label>Opportunity type</label><select id="ty"><option value="one_time">One-time task</option><option value="recurring">Recurring</option><option value="temporary">Temporary employment</option><option value="permanent">Permanent employment</option><option value="freelance">Freelance project</option><option value="contract">Contract</option></select></div></div><div id="loc2"><label>Province and district</label><select id="p">${opts(S.prov,prov)}</select><select id="di"></select></div><div class="grid2"><div><label>Start date</label><input id="sd" type="date"></div><div><label>Completion date</label><input id="cd" type="date"></div></div><label>Application deadline</label><input id="dl" type="date"><div id="officialFields" class="hidden"><label>Official job requirements (documents, CV, qualifications)</label><textarea id="req" placeholder="List required documents and qualifications"></textarea></div><label class="inlinecheck"><input id="ng" type="checkbox"> Budget is negotiable</label><button id="go">Publish opportunity</button><div id="msg" class="err"></div></div>`;
 const f=()=>$('#di').innerHTML=dOpts($('#p').value,cur);$('#p').onchange=f;f();
 $('#ar').onchange=()=>$('#loc2').classList.toggle('hidden',$('#ar').value==='virtual');$('#cl').onchange=()=>$('#officialFields').classList.toggle('hidden',$('#cl').value!=='official');
 $('#go').onclick=async()=>{if(S.busy)return;const title=$('#t').value.trim(),budget=+$('#b').value;if(title.length<5||!$('#d').value.trim()||!(budget>0)){ $('#msg').textContent='Enter a title (at least 5 characters), description and valid budget.';return;}
  S.busy=true;$('#go').textContent='Publishing…';const virtual=$('#ar').value==='virtual';
  const payload={poster_id:S.user.id,title,description:$('#d').value.trim(),category_id:+$('#c').value,budget_zmw:budget,negotiable:$('#ng').checked,opportunity_type:$('#ty').value,arrangement:$('#ar').value,district_id:virtual?null:+$('#di').value,classification:$('#cl').value,employer_name:$('#employer').value.trim()||null,requirements:$('#cl').value==='official'?$('#req').value.trim()||null:null,start_date:$('#sd').value||null,completion_date:$('#cd').value||null,deadline:$('#dl').value||null};
  const {error}=await db.from('jobs').insert(payload);S.busy=false;$('#go').textContent='Publish opportunity';if(error)$('#msg').textContent=error.message;else{S.tab='home';main();}};
}
async function avatarUrl(path){if(!path)return '';const {data}=db.storage.from('avatars').getPublicUrl(path);return data?.publicUrl||'';}
async function meView(){
 const p=S.profile;const [statsRes,postedRes,appsRes,reviewsRes]=await Promise.all([
  db.from('profile_stats').select('avg_rating,jobs_done').eq('id',S.user.id).maybeSingle(),
  db.from('jobs').select(JSEL).eq('poster_id',S.user.id).is('deleted_at',null).order('created_at',{ascending:false}),
  db.from('job_applications').select('id,status,intro,created_at,jobs('+JSEL+')').eq('applicant_id',S.user.id).order('created_at',{ascending:false}),
  db.from('reviews').select('id,rating,comment,created_at').eq('reviewee_id',S.user.id).order('created_at',{ascending:false})
 ]);
 const stats=statsRes.data||{},posted=postedRes.data||[],apps=(appsRes.data||[]).filter(x=>x.jobs),reviews=reviewsRes.data||[];
 const avg=stats.avg_rating??0,done=stats.jobs_done??0,section=S.profileSection||'overview',photo=await avatarUrl(p.avatar_url);
 app.innerHTML=`<div class="card"><div class="row"><img class="avatar" id="avatar" src="${photo}" alt="Profile photo" onerror="this.style.display='none'"><div style="flex:1"><h2 style="margin:0">${esc(p.full_name||'SHAMLOKO member')}</h2><div class="sm">@${esc(p.username||'username not set')} · ${esc(p.email||S.user.email||'')}</div><div class="sm">${Number(avg).toFixed(1)} ★ · ${done} completed jobs</div></div></div><div class="grid2" style="margin-top:12px"><button class="soft" id="photoUpload">Change photo</button><button class="alt" id="photoRemove">Remove photo</button></div><input id="photoFile" type="file" accept="image/*" class="hidden"></div>
 <div class="profiletabs">${[['overview','Overview'],['activity','Activity'],['posted','Jobs Posted'],['worked','Jobs Worked On'],['earnings','Earnings'],['reviews','Reviews'],['settings','Edit Profile']].map(([k,l])=>`<button class="${section===k?'soft':'alt'}" data-sec="${k}">${l}</button>`).join('')}</div><div id="profileContent"></div>`;
 $('#photoUpload').onclick=()=>$('#photoFile').click();
 $('#photoFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const path=`${S.user.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await db.storage.from('avatars').upload(path,f,{upsert:true});if(up.error)return alert(up.error.message);const {error}=await db.from('profiles').update({avatar_url:path}).eq('id',S.user.id);if(error)return alert('Photo uploaded, but profile update failed: '+error.message);if(p.avatar_url)await db.storage.from('avatars').remove([p.avatar_url]);await loadProfile();};
 $('#photoRemove').onclick=async()=>{if(!p.avatar_url)return alert('No profile photo to remove.');const {error}=await db.from('profiles').update({avatar_url:null}).eq('id',S.user.id);if(error)return alert(error.message);await db.storage.from('avatars').remove([p.avatar_url]);await loadProfile();};
 app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{S.profileSection=b.dataset.sec;meView();});
 const c=$('#profileContent');
 if(section==='overview')c.innerHTML=`<div class="grid2"><div class="stat"><div class="sm">JOBS POSTED</div><strong>${posted.length}</strong></div><div class="stat"><div class="sm">APPLICATIONS</div><strong>${apps.length}</strong></div><div class="stat"><div class="sm">COMPLETED JOBS</div><strong>${done}</strong></div><div class="stat"><div class="sm">RATING</div><strong>${Number(avg).toFixed(1)} ★</strong></div></div><div class="card"><h3>About</h3><p>${esc(p.bio||'Add a short introduction in Edit Profile.')}</p><div class="sm">Skills: ${esc((p.skills||[]).join(', ')||'Not added')}</div><div class="sm">Member since ${dateText(p.created_at?.slice(0,10))}</div></div>`;
 if(section==='activity')c.innerHTML=`<div class="card"><h3>Your activity</h3><p>Jobs posted: <b>${posted.length}</b></p><p>Applications submitted: <b>${apps.length}</b></p><p>Completed jobs: <b>${done}</b></p><p>Free postings used: <b>${p.posts_created??0}/5</b></p><p>Free applications used: <b>${p.applications_made??0}/5</b></p></div><h3>Recent activity</h3>${posted.slice(0,4).map(jobCard).join('')}${apps.slice(0,4).map(x=>jobCard({...x.jobs,_app:x.status})).join('')}`;
 if(section==='posted')c.innerHTML=`<h3>Jobs you've posted</h3>${posted.length?posted.map(j=>jobCard(j)+'<button class="alt" data-edit="'+j.id+'">Edit listing · '+esc(j.status)+'</button>').join(''):'<div class="card empty">You haven\'t posted any jobs yet.</div>'}`;
 if(section==='worked')c.innerHTML=`<h3>Jobs you've worked on</h3>${apps.length?apps.map(x=>jobCard({...x.jobs,_app:x.status})).join(''):'<div class="card empty">No applications or work history found.</div>'}`;
 if(section==='earnings')c.innerHTML=`<div class="card"><h3>Earnings and activity</h3><div class="big">${done}</div><div class="sm">Completed jobs</div><p>Free postings used: ${p.posts_created??0}/5<br>Free applications used: ${p.applications_made??0}/5</p><div class="sm">Cash earnings are not displayed yet because this database schema does not provide payout totals.</div></div>`;
 if(section==='reviews')c.innerHTML=`<div class="card"><div class="big">${Number(avg).toFixed(1)} ★</div><div class="sm">${reviews.length} reviews</div></div>${reviews.map(r=>`<div class="card"><b>${Number(r.rating||0)} ★</b><p>${esc(r.comment||'No written comment')}</p><div class="sm">${dateText(r.created_at?.slice(0,10))}</div></div>`).join('')||'<div class="card empty">No reviews yet.</div>'}`;
 if(section==='settings')c.innerHTML=`<div class="card"><h3>Personal details</h3><label>Full name</label><input id="pname" value="${esc(p.full_name||'')}"><label>Username</label><input id="puser" value="${esc(p.username||'')}"><label>Email address</label><input id="pemail" type="email" value="${esc(S.user.email||p.email||'')}"><div class="sm">Supabase may send a confirmation link before an email change takes effect.</div><label>Phone number</label><input id="pphone" value="${esc(p.phone||'')}"><label>Bio</label><textarea id="pbio">${esc(p.bio||'')}</textarea><label>Skills (comma separated)</label><input id="pskills" value="${esc((p.skills||[]).join(', '))}"><button id="saveProfile">Save changes</button><div id="pmsg" class="err"></div></div><div class="card"><h3>Working location</h3><select id="p">${opts(S.prov,S.dist.find(d=>d.id==p.working_district_id)?.province_id)}</select><select id="di"></select><button class="alt" id="sv">Update location</button></div><button class="alt" id="out">Log out</button>`;
 if(section==='settings'){
  const f=()=>$('#di').innerHTML=dOpts($('#p').value,p.working_district_id);$('#p').onchange=f;f();
  $('#saveProfile').onclick=async()=>{const newEmail=$('#pemail').value.trim(),oldEmail=S.user.email;const upd={full_name:$('#pname').value.trim(),username:$('#puser').value.trim()||null,phone:$('#pphone').value.trim(),bio:$('#pbio').value.trim(),skills:$('#pskills').value.split(',').map(x=>x.trim()).filter(Boolean)};
   const {error}=await db.from('profiles').update(upd).eq('id',S.user.id);if(error){$('#pmsg').textContent=error.message;return;}
   if(newEmail&&newEmail!==oldEmail){const {data,error:emailError}=await db.auth.updateUser({email:newEmail});if(emailError){$('#pmsg').textContent='Profile saved, but email update failed: '+emailError.message;return;}$('#pmsg').textContent='Profile saved. Check your inbox to confirm the new email address.';}
   else $('#pmsg').textContent='Profile updated successfully.';
   await loadProfile();S.profileSection='settings';};
  $('#sv').onclick=async()=>{const {error}=await db.from('profiles').update({working_district_id:+$('#di').value}).eq('id',S.user.id);if(error)alert(error.message);else{S.profile.working_district_id=+$('#di').value;main();}};
  $('#out').onclick=async()=>{await db.auth.signOut();S.profile=null;S.user=null;authView();};
 }
 c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editJob(b.dataset.edit));
}
async function editJob(id){
 const {data:j,error}=await db.from('jobs').select('*').eq('id',id).eq('poster_id',S.user.id).single();if(error)return alert(error.message);
 app.innerHTML=`<button class="alt" id="back">← Back to profile</button><div class="card"><h2>Edit opportunity</h2><label>Title</label><input id="et" value="${esc(j.title)}"><label>Description</label><textarea id="ed">${esc(j.description)}</textarea><label>Budget (K)</label><input id="eb" type="number" value="${j.budget_zmw}"><label>Classification</label><select id="ec"><option value="official">Official</option><option value="unofficial">Unofficial</option></select><label>Employer name</label><input id="eem" value="${esc(j.employer_name||'')}"><label>Requirements</label><textarea id="er">${esc(j.requirements||'')}</textarea><label>Start date</label><input id="es" type="date" value="${j.start_date||''}"><label>Completion date</label><input id="ecm" type="date" value="${j.completion_date||''}"><label>Application deadline</label><input id="edl" type="date" value="${j.deadline||''}"><button id="save">Save changes</button><div id="emsg" class="err"></div></div>`;
 $('#ec').value=j.classification||'unofficial';$('#back').onclick=()=>{S.profileSection='posted';meView();};
 $('#save').onclick=async()=>{const {error}=await db.from('jobs').update({title:$('#et').value.trim(),description:$('#ed').value.trim(),budget_zmw:+$('#eb').value,classification:$('#ec').value,employer_name:$('#eem').value.trim()||null,requirements:$('#er').value.trim()||null,start_date:$('#es').value||null,completion_date:$('#ecm').value||null,deadline:$('#edl').value||null}).eq('id',id).eq('poster_id',S.user.id);$('#emsg').textContent=error?error.message:'Saved.';if(!error){S.profileSection='posted';meView();}};
}
document.addEventListener('click',e=>{const c=e.target.closest('.job');if(c?.dataset.id)jobView(c.dataset.id);});
async function jobView(id){
 app.innerHTML='<div class="card">Loading opportunity…</div>';
 const {data:j,error}=await db.from('jobs').select('*,districts(name),categories(name)').eq('id',id).single();if(error){app.innerHTML=`<div class="card err">${esc(error.message)}</div>`;return;}
 const mine=j.poster_id===S.user.id,open=ACTIVE.includes(j.status);let h=`<button class="alt" id="bk">← Back</button><div class="card"><div class="between"><h2>${esc(j.title)}</h2><div class="big">${K(j.budget_zmw)}</div></div><span class="tag">${j.classification==='official'?'Official':'Unofficial'}</span><span class="tag">${j.arrangement==='virtual'?'Virtual':'Physical'}</span><span class="tag">${esc(j.status)}</span><p>${esc(j.description)}</p><div class="sm">${esc(j.employer_name||'')} · ${esc(j.districts?.name||'Anywhere in Zambia')}</div><div class="sm">Start: ${dateText(j.start_date)} · Completion: ${dateText(j.completion_date)} · Deadline: ${dateText(j.deadline)}</div>${j.classification==='official'?`<hr><b>Requirements</b><p>${esc(j.requirements||'Not specified')}</p>`:''}</div>`;
 if(mine){const {data:ap,error:ae}=await db.from('job_applications').select('*,profiles(full_name)').eq('job_id',id).order('created_at');if(ae)h+=`<div class="card err">${esc(ae.message)}</div>`;else h+=`<h3>Applicants (${ap?.length||0})</h3>`+(ap||[]).map(a=>`<div class="card"><b>${esc(a.profiles?.full_name||'Applicant')}</b><span class="tag">${esc(a.status)}</span><p>${esc(a.intro)}</p>${a.status==='pending'?`<button data-acc="${a.id}">Accept</button><button class="alt" data-rej="${a.id}">Reject</button>`:''}</div>`).join('');}
 else if(open){const {data:mineApp}=await db.from('job_applications').select('id').eq('job_id',id).eq('applicant_id',S.user.id).maybeSingle();h+=mineApp?'<div class="card empty">You have already applied.</div>':`<div class="card"><h3>Apply</h3><textarea id="intro" placeholder="Introduce yourself and your skills"></textarea><input id="tm" placeholder="Estimated completion time"><button id="apply">Send application</button><div id="msg" class="err"></div></div>`;}
 app.innerHTML=h;$('#bk').onclick=()=>main();
 app.querySelectorAll('[data-acc]').forEach(b=>b.onclick=async()=>{const {error}=await db.rpc('accept_application',{app_id:b.dataset.acc});if(error)alert(error.message);else jobView(id);});
 app.querySelectorAll('[data-rej]').forEach(b=>b.onclick=async()=>{const {error}=await db.from('job_applications').update({status:'rejected'}).eq('id',b.dataset.rej);if(error)alert(error.message);else jobView(id);});
 if($('#apply'))$('#apply').onclick=async()=>{if(!$('#intro').value.trim())return $('#msg').textContent='Please introduce yourself.';const {error}=await db.from('job_applications').insert({job_id:id,applicant_id:S.user.id,intro:$('#intro').value.trim(),estimated_time:$('#tm').value.trim()});if(error)$('#msg').textContent=error.message;else jobView(id);};
}
db.auth.onAuthStateChange((_event,session)=>{if(!session){S.user=null;S.profile=null;$('#nav').hidden=true;authView();}});
boot();
</script>
</body></html>
