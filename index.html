@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap');
:root{
 --bg:#F5F1E8; --card:#FFFCF6; --g:#164E3B; --gl:#E5EDE4;
 --t:#252A28; --m:#68736B; --bd:#DEDCCF; --hot:#A65B42;
 --forest:#164E3B; --sage:#78977D; --ivory:#F5F1E8; --sand:#E8D2A8;
 --soft:#F0E9DA; --shadow:0 5px 18px rgba(37,42,40,.055);
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--t);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.005em}
h1,h2,h3,h4,.auth-brand,header>span,.profile-head b{font-family:'Poppins','Inter',sans-serif;letter-spacing:-.02em}

header,nav,#menuPanel,#hsearch,.home-top,.profile-head{background:var(--card);border-color:var(--bd)}

button.r{background:var(--card);border-color:#D7B5A8}

.unread{border-left-color:var(--sage)}

</style></head><body>
<header><span>SHAM<b>LOKO</b></span><div class="hactions">
<button id="inboxBtn" class="hbtn" title="Inbox" aria-label="Inbox">✉</button>
<button id="quickPost" class="hbtn primary" title="Post a job" aria-label="Post a job">＋</button>
<button id="searchBtn" class="hbtn" title="Search" aria-label="Search">⌕</button>
<button id="menuBtn" class="hbtn" title="Menu" aria-label="Menu">☰</button>
<button id="bell" class="hbtn" hidden title="Notifications">♧<i id="bc" hidden></i></button>
</div><div id="hsearch"><input id="globalSearch" placeholder="Search opportunities, skills or services"></div>
<div id="menuPanel"><button data-menu="home">Home</button><button data-menu="explore">Explore opportunities</button><button data-menu="post">Post a job</button><button data-menu="profile">My profile</button><button data-menu="notif">Notifications</button><button data-menu="inbox">Inbox messages</button><button data-menu="admin">Admin panel</button></div></header>
<main id="app">Loading…</main>
<nav id="nav" hidden></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://arfsggndgyezukwuvmad.supabase.co', SUPABASE_ANON_KEY='sb_publishable_Wso8pBQlyjISd5Qqv-FqyQ_J0fQSHor'; // anon key only, never the service key
let REC=/type=recovery/.test(location.hash);
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=n=>'K'+Number(n||0).toLocaleString('en-US');
const S={user:null,profile:null,prov:[],dist:[],cats:[],tab:'home',busy:false,profileEditing:false};
const opts=(a,sel)=>a.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.name)}</option>`).join('');
const dOpts=(pid,sel)=>opts(S.dist.filter(d=>d.province_id==pid),sel);

async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(REC&&session)return recoveryView();
  const [p,d,c]=await Promise.all([db.from('provinces').select('*').order('name'),db.from('districts').select('*').order('name'),db.from('categories').select('*').eq('active',true).order('name')]);
  S.prov=p.data||[];S.dist=d.data||[];S.cats=c.data||[];
  if(!session) return authView();
  S.user=session.user; await loadProfile();
}
async function loadProfile(){
  const {data}=await db.from('profiles').select('*').eq('id',S.user.id).maybeSingle();
  S.profile=data; if(data)await loadSaved(); data?main():setupView();
}
function authView(){
  $('#nav').hidden=true;
  app.innerHTML=`<div class="card"><div class="auth-brand">SHAM<b>LOKO</b></div>
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)">
  <button id="in">Log in</button><button class="alt" id="up">Create account</button><a href="#" id="fg" class="sm">Forgot password?</a><div id="msg" class="err"></div></div>`;
  const go=async fn=>{const {error}=await fn({email:$('#em').value.trim(),password:$('#pw').value});
    if(error)$('#msg').textContent=error.message;else boot();};
  $('#in').onclick=()=>go(db.auth.signInWithPassword.bind(db.auth));
  $('#up').onclick=()=>go(db.auth.signUp.bind(db.auth));
  $('#fg').onclick=async e=>{e.preventDefault();const em=$('#em').value.trim();if(!em)return $('#msg').textContent='Type your email above first.';
    const {error}=await db.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});$('#msg').className=error?'err':'sm';
    $('#msg').textContent=error?error.message:'If that email has an account, a reset link is on its way. Check your inbox and spam folder.';};
}
function setupView(){
  $('#nav').hidden=true;
  app.innerHTML=`<div class="card"><h3>Your profile</h3>
  <input id="fn" placeholder="Full name"><input id="ph" placeholder="Phone (e.g. 097...)">
  <textarea id="bio" placeholder="Short bio"></textarea><input id="sk" placeholder="Skills, comma separated">
  <div class="sm">HOME LOCATION</div><select id="hp">${opts(S.prov)}</select><select id="hd"></select>
  <div class="sm">WORKING LOCATION (you can change it later)</div><select id="wp">${opts(S.prov)}</select><select id="wd"></select>
  <button id="sv">Save and continue</button><div id="msg" class="err"></div></div>`;
  const link=(p,d)=>{const f=()=>$(d).innerHTML=dOpts($(p).value);$(p).onchange=f;f();};
  link('#hp','#hd');link('#wp','#wd');
  $('#sv').onclick=async()=>{
    const name=$('#fn').value.trim(); if(!name) return $('#msg').textContent='Enter your full name';
    const {error}=await db.from('profiles').insert({id:S.user.id,full_name:name,phone:$('#ph').value.trim(),email:S.user.email,bio:$('#bio').value.trim(),
      skills:$('#sk').value.split(',').map(s=>s.trim()).filter(Boolean),home_district_id:+$('#hd').value,working_district_id:+$('#wd').value});
    error?$('#msg').textContent=error.message:loadProfile();};
}

const ACTIVE=['published','applications_open'];
const JSEL='id,title,description,budget_zmw,arrangement,classification,status,created_at,deadline,districts(name),categories(name),profiles!poster_id(full_name,verification_status),job_comments(count),job_likes(count),applicant_count';
const ICON={'Errands':'🛍️','Delivery':'📦','Transport':'🚚','Cleaning':'🧹','Electrical':'💡','Plumbing':'🔧','Construction':'🏗️','Agriculture':'🌾','IT':'💻','Graphic design':'🎨','Digital marketing':'📣','Writing':'✍️','Education':'📚','General labour':'💪','Formal employment':'🏢'};
S.saved=new Set();S.liked=new Set();S.f={q:'',cls:'',arr:'',cat:'',sort:'created_at'};
async function loadSaved(){const [a,b]=await Promise.all([db.from('saved_jobs').select('job_id').eq('user_id',S.user.id),db.from('job_likes').select('job_id').eq('user_id',S.user.id)]);S.saved=new Set((a.data||[]).map(x=>x.job_id));S.liked=new Set((b.data||[]).map(x=>x.job_id));}
const logSearch=t=>{if(t)db.from('search_log').insert({user_id:S.user.id,term:t.slice(0,60)}).then(()=>{});};
function main(){
  const n=$('#nav');n.hidden=false;
  n.innerHTML=[['home','Home'],['explore','Explore'],['post','Post a Job'],['profile','Profile']].map(([k,l])=>`<button data-t="${k}" class="${k==S.tab?'on':''} ${k=='post'?'post':''}">${l}</button>`).join('');
  n.onclick=e=>{const t=e.target.dataset.t;if(t){S.tab=t;main();}};
  const dn=S.dist.find(d=>d.id==S.profile.working_district_id);
  $('#bell').hidden=false;$('#bell').onclick=()=>{S.tab='notif';main();};
  $('#inboxBtn').onclick=()=>{S.tab='inbox';main();};
  $('#quickPost').onclick=()=>{S.tab='post';main();};
  $('#searchBtn').onclick=()=>{const x=$('#hsearch');x.style.display=x.style.display=='block'?'none':'block';if(x.style.display=='block')$('#globalSearch').focus();};
  $('#globalSearch').onkeydown=e=>{if(e.key=='Enter'){S.f.q=$('#globalSearch').value.trim();logSearch(S.f.q);S.tab='explore';$('#hsearch').style.display='none';main();}};
  $('#menuBtn').onclick=()=>{const x=$('#menuPanel');x.style.display=x.style.display=='block'?'none':'block';};
  document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const t=b.dataset.menu;$('#menuPanel').style.display='none';if(t==='admin'){location.href='admin.html';return;}S.tab=t;main();});
  watch();
  ({home:homeView,explore:exploreView,post:postView,profile:profileView,notif:notifView,inbox:inboxView})[S.tab]();
}
function watch(){if(S.ch)return;refreshBell();S.ch=db.channel('n'+S.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+S.user.id},refreshBell).subscribe();}
async function refreshBell(){const {count}=await db.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',S.user.id).eq('read',false);const b=$('#bc');b.textContent=count||'';b.hidden=!count;}
function timeAgo(value){
 const ms=Math.max(0,Date.now()-new Date(value).getTime()),m=Math.floor(ms/60000),h=Math.floor(m/60),d=Math.floor(h/24),w=Math.floor(d/7),mo=Math.floor(d/30);
 if(m<1)return 'just now';if(m<60)return m+' min ago';if(h<24)return h+' hr'+(h===1?'':'s')+' ago';if(d<7)return d+' day'+(d===1?'':'s')+' ago';if(w<5)return w+' week'+(w===1?'':'s')+' ago';return mo+' month'+(mo===1?'':'s')+' ago';
}
function deadlineLabel(value){if(!value)return '';const ms=new Date(value).getTime()-Date.now(),d=Math.ceil(ms/86400000);if(d<0)return 'Deadline passed';if(d===0)return 'Expires today';if(d===1)return 'Expires tomorrow';return 'Expires in '+d+' days';}
const jobCard=j=>{const n=j.job_comments?.[0]?.count||0,sv=S.saved.has(j.id),lk=j.job_likes?.[0]?.count||0,ld=S.liked.has(j.id),expiry=deadlineLabel(j.deadline);
 return `<div class="card"><div class="job" data-id="${j.id}">
 <div class="posted-by"><b>${esc(j.profiles?.full_name||'SHAMLOKO member')}${j.profiles?.verification_status=='verified'?' ✓':''}</b><span class="posted-label">posted</span><span class="sm">${timeAgo(j.created_at)}</span>${expiry?`<span class="job-deadline">· ${esc(expiry)}</span>`:''}</div>
 <b class="job-title">${esc(j.title)}</b><div class="big" style="font-size:19px">${K(j.budget_zmw)}</div>
 <p class="job-description">${esc(j.description||'')}</p>
 <span class="tag">${j.classification=='official'?'Official':'Unofficial'}</span><span class="tag">${j.arrangement=='virtual'?'Virtual':'Physical'}</span><span class="tag">${esc(j.categories?.name||'Other')}</span><span class="tag">👥 ${j.applicant_count||0}</span>${j._tag?'<span class="tag">'+esc(j._tag)+'</span>':''}${j.status&&!ACTIVE.includes(j.status)?'<span class="tag">'+esc(j.status)+'</span>':''}
 <div class="sm">📍 ${esc(j.districts?.name||'Anywhere in Zambia')}</div></div>
 <div class="acts"><button data-act="like" data-id="${j.id}" data-n="${lk}" style="${ld?'color:var(--g)':''}">👍 ${lk}</button><button data-act="comment" data-id="${j.id}">💬 ${n}</button><button data-act="save" data-id="${j.id}">${sv?'★ Saved':'☆ Save'}</button><button data-act="share" data-id="${j.id}">Share</button></div><button class="a2" data-act="apply" data-id="${j.id}">Apply for Job</button></div>`;};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id,a=b.dataset.act;
 if(a=='like'){const on=S.liked.has(id),n=+b.dataset.n;const {error}=on?await db.from('job_likes').delete().eq('user_id',S.user.id).eq('job_id',id):await db.from('job_likes').insert({user_id:S.user.id,job_id:id});if(error)return alert(error.message);on?S.liked.delete(id):S.liked.add(id);b.dataset.n=n+(on?-1:1);b.textContent='👍 '+b.dataset.n;b.style.color=on?'':'var(--g)';return;}
 if(a=='apply')jobView(id);

    pb.innerHTML=`<div class="card"><b>Pay per application or subscribe monthly</b><p class="sm">Without an active membership, each job application costs K1.00. Lite and Pro memberships remove the per-application fee while active.</p>${(sub.data||[]).map(x=>`<div class="pn">✓ ${esc(x.plan||'Plan')} active until ${new Date(x.expires_at).toLocaleDateString()}</div>`).join('')||'<div class="sm">No active membership.</div>'}</div>
    <div class="card pc"><b>Lite</b><div class="big">K9.99 <span class="sm">/ month</span></div><div class="sm">Unlimited job applications for 30 days.</div><button data-plan="lite">Choose Lite</button></div>
    <div class="card pc"><b>Pro</b><div class="big">K19.99 <span class="sm">/ month</span></div><div class="sm">Unlimited job applications for 30 days.</div><button data-plan="pro">Choose Pro</button></div>
    <div id="planPay"></div>`+((rq.data||[]).length?'<h3>My membership payment requests</h3>'+rq.data.map(t=>`<div class="card sm">${new Date(t.created_at).toLocaleDateString()} · ${esc(t.plan)} · ${esc(t.network)} · ${esc(t.reference)} · <b>${esc(t.status)}</b></div>`).join(''):'');
    pb.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{const plan=b.dataset.plan,amount=plan==='lite'?9.99:19.99;$('#planPay').innerHTML=`<div class="card"><b>Pay K${amount.toFixed(2)} for ${plan==='lite'?'Lite':'Pro'}</b><div class="pn">MTN: 0964 31 93 21</div><div class="pn">Airtel: 05 72 42 17 74</div><p class="sm">Send the exact amount, then submit the transaction ID from your SMS. Membership starts after admin approval.</p><select id="planNetwork"><option>MTN</option><option>Airtel</option></select><input id="planReference" placeholder="Mobile money transaction ID"><button id="sendPlanRequest">Send Transaction ID</button><div id="planMsg" class="sm"></div></div>`;
      $('#sendPlanRequest').onclick=async()=>{const ref=$('#planReference').value.trim();if(ref.length<5)return $('#planMsg').textContent='Enter the transaction ID.';const {error}=await db.from('subscription_requests').insert({user_id:p.id,plan,network:$('#planNetwork').value,reference:ref});$('#planMsg').textContent=error?error.message:'Submitted. Membership will activate after payment approval.';if(!error)$('#sendPlanRequest').disabled=true;};
    });
  }else if(pt=='Qualifications'){
    const {data}=await db.from('qualifications').select('*').eq('user_id',p.id).order('created_at',{ascending:false});
    pb.innerHTML=`<div class="card"><b>Add a qualification</b><input id="qt" placeholder="Title (e.g. Diploma in Electrical Engineering)"><input id="qi" placeholder="Institution (optional)"><input id="qf" type="file" accept="image/*,application/pdf"><button id="qs">Upload</button><div class="sm">Private: only you can open these files. They are not verified yet.</div></div>`+((data||[]).map(q=>`<div class="card"><b>${esc(q.title)}</b><div class="sm">${esc(q.institution||'')} · ${esc(q.status)}</div><div class="row"><button class="alt" data-v="${q.file_path}">View</button><button class="alt" data-d="${q.id}" data-p="${q.file_path}">Delete</button></div></div>`).join('')||'<div class="card sm">No qualifications uploaded yet.</div>');
    $('#qs').onclick=async()=>{const f=$('#qf').files[0],t=$('#qt').value.trim();if(!t||!f)return alert('Add a title and choose a file');if(f.size>5e6)return alert('File must be under 5 MB');
      const path=p.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_'),{error}=await db.storage.from('qualifications').upload(path,f,{contentType:f.type});if(error)return alert(error.message);
      const r=await db.from('qualifications').insert({user_id:p.id,title:t,institution:$('#qi').value.trim()||null,file_path:path});r.error?alert(r.error.message):profileView();};
    pb.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const {data:u}=await db.storage.from('qualifications').createSignedUrl(b.dataset.v,60);u&&window.open(u.signedUrl,'_blank');});
    pb.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this file?'))return;await db.storage.from('qualifications').remove([b.dataset.p]);await db.from('qualifications').delete().eq('id',b.dataset.d);profileView();});
  }else{
    pb.innerHTML=`<div class="card"><b>Profile picture</b><input id="pf" type="file" accept="image/*"><button id="photoSave">Update profile picture</button><div class="sm">Choose a clear image under 2 MB.</div></div>
    <div class="card"><b>Change password</b><input id="oldpw" type="password" placeholder="Current password"><input id="newpw" type="password" placeholder="New password (at least 6 characters)"><input id="newpw2" type="password" placeholder="Confirm new password"><button id="changePw">Change password</button><div id="pwmsg" class="sm"></div></div>
    <div class="card"><b>Verification</b><div class="sm">Status: ${esc(p.verification_status)}${p.employer_verified?' · Employer verified':''}. Your ID number and documents are private and never shown to other users.</div><select id="vk"><option value="identity">Identity (NRC)</option><option value="employer">Employer / business</option></select><input id="vn" placeholder="NRC number or company registration number"><input id="vf" type="file" accept="image/*,application/pdf"><button id="vs">Submit for verification</button><div id="vm" class="sm"></div></div>
    <div class="card"><b>Development tools</b><div class="sm">Admin panel access uses the temporary development PIN.</div><button class="alt" id="ad">Open admin panel</button></div><button class="alt" id="out">Sign out</button>`;
    $('#photoSave').onclick=async()=>{const f=$('#pf').files[0];if(!f)return $('#vm').textContent='Choose a photo first.';if(!f.type.startsWith('image/')||f.size>2e6)return alert('Choose an image under 2 MB');const path=p.id+'/avatar';const {error}=await db.storage.from('avatars').upload(path,f,{upsert:true,contentType:f.type});if(error)return alert(error.message);const url=db.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?t='+Date.now();const r=await db.from('profiles').update({photo_url:url}).eq('id',p.id);if(r.error)return alert(r.error.message);p.photo_url=url;profileView();};
    $('#changePw').onclick=async()=>{const old=$('#oldpw').value,n=$('#newpw').value;if(!old||!n)return $('#pwmsg').textContent='Enter your current and new passwords.';if(n.length<6)return $('#pwmsg').textContent='Use at least 6 characters.';if(n!==$('#newpw2').value)return $('#pwmsg').textContent='The new passwords do not match.';const check=await db.auth.signInWithPassword({email:S.user.email,password:old});if(check.error)return $('#pwmsg').textContent='Current password is incorrect.';const {error}=await db.auth.updateUser({password:n});$('#pwmsg').textContent=error?error.message:'Password changed successfully.';if(!error){$('#oldpw').value='';$('#newpw').value='';$('#newpw2').value='';}};
    $('#vs').onclick=async()=>{const f=$('#vf').files[0],n=$('#vn').value.trim();if(!f||!n)return $('#vm').textContent='Add the number and a document.';if(f.size>5e6)return $('#vm').textContent='File must be under 5 MB';
      const path=p.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_'),u=await db.storage.from('verification').upload(path,f,{contentType:f.type});if(u.error)return $('#vm').textContent=u.error.message;
      const {error}=await db.from('verification_requests').insert({user_id:p.id,kind:$('#vk').value,id_number:n,doc_path:path});
      if(!error&&$('#vk').value=='identity'&&['unverified','rejected'].includes(p.verification_status)){await db.from('profiles').update({verification_status:'pending'}).eq('id',p.id);p.verification_status='pending';}
      $('#vm').textContent=error?error.message:'Submitted. We will review it soon.';};
    $('#ad').onclick=()=>{location.href='admin.html';};
    $('#out').onclick=async()=>{S.ch&&db.removeChannel(S.ch);S.ch=null;await db.auth.signOut();S.profile=null;$('#bell').hidden=true;boot();};
  }
}

document.addEventListener('click',e=>{const c=e.target.closest('.job');if(c)jobView(c.dataset.id);});
async function jobView(id){
  app.innerHTML='<div class="card">Loading…</div>';
  const {data:j,error}=await db.from('jobs').select('*,districts(name),categories(name)').eq('id',id).single();
  if(error)return app.innerHTML=`<div class="card err">${esc(error.message)}</div>`;
  const mine=j.poster_id==S.user.id,open=ACTIVE.includes(j.status);
  let h=`<button class="alt" id="bk">← Back</button><div class="card"><h3>${esc(j.title)}</h3><div class="big" style="font-size:22px">${K(j.budget_zmw)}</div><span class="tag">${esc(j.status)}</span><span class="tag">${j.classification=='official'?'Official':'Unofficial'}</span><span class="tag">${j.negotiable?'Negotiable':'Fixed price'}</span><span class="tag">${esc(j.districts?.name||'Anywhere in Zambia')}</span><p>${esc(j.description)}</p>${j.requirements?'<div class="sm">REQUIREMENTS</div><p>'+esc(j.requirements)+'</p>':''}</div>`;
  if(mine){
    const {data:ap}=await db.from('job_applications').select('*,profiles!applicant_id(full_name,verification_status)').eq('job_id',id).order('created_at');
    h+='<h3>Applicants</h3>'+(ap&&ap.length?ap.map(a=>`<div class="card"><b>${esc(a.profiles?.full_name)}</b> <span class="tag">${esc(a.status)}</span><p>${esc(a.intro)}</p><button class="alt" data-msg="${a.applicant_id}">Message Applicant</button><div class="sm">${a.proposed_price_zmw?'Offer '+K(a.proposed_price_zmw)+' · ':''}${esc(a.estimated_time||'')}</div>${a.status=='pending'&&open?`<button data-acc="${a.id}">Accept</button><button class="alt" data-rej="${a.id}">Reject</button>`:''}</div>`).join(''):'<div class="card sm">No applications yet.</div>');
    const nx={assigned:['in_progress','Start work'],in_progress:['completed','Mark completed']}[j.status];
    if(nx)h+=`<button data-st="${nx[0]}">${nx[1]}</button>`;
    if(['published','applications_open','assigned','in_progress'].includes(j.status))h+=`<button class="alt" data-st="cancelled">Cancel job</button>`;
    if(j.status=='completed')h+='<div class="card sm">Payment is settled directly between you and the worker. Off-platform payments are not covered by platform protection.</div>';
  }else if(open){
    const {data:mineApp}=await db.from('job_applications').select('id').eq('job_id',id).eq('applicant_id',S.user.id).maybeSingle();
    h+=mineApp?'<div class="card sm">You have already applied for this job.</div>':`<div class="card" id="apf"><h3>Ready to apply?</h3><p class="sm">Apply for this opportunity. A one-time application costs K1, or choose a monthly Lite or Pro membership for unlimited applications.</p><button id="applyJobBtn">Apply for Job</button><div id="applyPanel"></div></div>`;
  }
  h+=await extras(j,mine);
  app.innerHTML=h;
  bindExtras(j);
  $('#bk').onclick=()=>main();
  const act=async(p,msg)=>{const {error}=await p;error?alert(error.message):jobView(id);};
  app.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>act(db.rpc('accept_application',{app_id:b.dataset.acc})));
  app.querySelectorAll('[data-rej]').forEach(b=>b.onclick=()=>act(db.from('job_applications').update({status:'rejected'}).eq('id',b.dataset.rej)));
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>confirm('Are you sure?')&&act(db.rpc('set_job_status',{p_job:id,p_status:b.dataset.st})));
}

async function openApplyPanel(j){
  const host=$('#applyPanel'); if(!host)return;
  host.innerHTML='<div class="card sm">Checking your membership…</div>';
  const {data:sub,error}=await db.from('subscriptions').select('id,plan,expires_at').eq('user_id',S.user.id).gt('expires_at',new Date().toISOString()).order('expires_at',{ascending:false}).limit(1);
  if(error){host.innerHTML='<div class="err">Could not check membership: '+esc(error.message)+'</div>';return;}
  const active=!!(sub&&sub.length);
  host.innerHTML=`<div class="sep"></div><h3>Application details</h3><textarea id="appIntro" placeholder="Introduce yourself and your relevant skills"></textarea>${j.negotiable?'<input id="appPrice" type="number" min="1" placeholder="Your price (ZMW)">':''}<input id="appTime" placeholder="Estimated time (e.g. 2 days)"><input id="appPortfolio" placeholder="Portfolio link (optional)"><div class="card sm">${active?'Your '+esc(sub[0].plan||'membership')+' membership is active until '+new Date(sub[0].expires_at).toLocaleDateString()+'. No application fee is due.':'Choose how you want to apply below.'}</div>${active?'<button id="sendApplication">Submit Application</button>':`<h3>Choose your payment</h3><div class="card"><b>Single application</b><div class="big">K1.00</div><div class="sm">Pay once for this job application.</div><button id="chooseSingle">Pay K1 and Apply</button></div><div class="card"><b>Lite monthly</b><div class="big">K9.99 <span class="sm">/ month</span></div><div class="sm">Unlimited job applications while active.</div><button id="chooseLite">Choose Lite</button></div><div class="card"><b>Pro monthly</b><div class="big">K19.99 <span class="sm">/ month</span></div><div class="sm">Unlimited job applications while active.</div><button id="choosePro">Choose Pro</button></div><div id="paymentEntry"></div>`}<div id="applyMsg" class="sm"></div>`;
  const payload=()=>{const intro=$('#appIntro').value.trim();if(!intro){$('#applyMsg').textContent='Please introduce yourself before continuing.';return null;}return {intro,proposed_price_zmw:$('#appPrice')&&$('#appPrice').value?Number($('#appPrice').value):null,estimated_time:$('#appTime').value.trim(),portfolio_url:$('#appPortfolio').value.trim()||null};};
  const submitApplication=async()=>{const d=payload();if(!d)return;if(S.busy)return;S.busy=true;$('#sendApplication').disabled=true;const {error}=await db.from('job_applications').insert({job_id:j.id,applicant_id:S.user.id,...d});S.busy=false;if(error){$('#sendApplication').disabled=false;$('#applyMsg').textContent=error.message;return;}await refreshMe();jobView(j.id);};
  if(active){$('#sendApplication').onclick=submitApplication;return;}
  const paymentForm=(type,amount)=>{const d=payload();if(!d)return;const box=$('#paymentEntry');box.innerHTML=`<div class="card"><b>Pay K${amount.toFixed(2)} by mobile money</b><div class="pn">MTN: 0964 31 93 21</div><div class="pn">Airtel: 05 72 42 17 74</div><p class="sm">Send the exact amount to the number for your preferred network, then enter the transaction ID from your confirmation SMS. Your application will be submitted after admin verifies the payment.</p><select id="applyNetwork"><option value="MTN">MTN</option><option value="Airtel">Airtel</option></select><input id="applyReference" placeholder="Mobile money transaction ID"><button id="sendPaymentRequest">Send Transaction ID</button><div id="paymentMsg" class="sm"></div></div>`;
    $('#sendPaymentRequest').onclick=async()=>{const ref=$('#applyReference').value.trim();if(ref.length<5){$('#paymentMsg').textContent='Enter the transaction ID from your mobile money SMS.';return;}if(S.busy)return;S.busy=true;$('#sendPaymentRequest').disabled=true;
      const {error}=await db.from('application_payment_requests').insert({user_id:S.user.id,job_id:j.id,payment_type:type,amount_zmw:amount,network:$('#applyNetwork').value,transaction_id:ref,application_data:d});S.busy=false;
      if(error){$('#sendPaymentRequest').disabled=false;$('#paymentMsg').textContent=error.message.includes('duplicate')?'That transaction ID has already been submitted.':error.message;return;}
      $('#paymentMsg').textContent='Transaction ID submitted. Your application is pending payment verification. You can track its status in your Profile.';
      $('#sendPaymentRequest').disabled=true;
    };
  };
  $('#chooseSingle').onclick=()=>paymentForm('single_application',1);
  $('#chooseLite').onclick=()=>{S.pt='Plans';S.tab='profile';main();};
  $('#choosePro').onclick=()=>{S.pt='Plans';S.tab='profile';main();};
}

const FREE=5;
async function refreshMe(){const {data}=await db.from('profiles').select('*').eq('id',S.user.id).single();if(data)S.profile=data;}
function gateMsg(sel,e){const el=$(sel);if(e.message.includes('SUBSCRIPTION_REQUIRED')){el.innerHTML='You have used your free allowance. <a href="#" id="gp">Choose a plan to continue</a>';$('#gp').onclick=ev=>{ev.preventDefault();S.tab='profile';S.pt='Plans';main();};}else el.textContent=e.message.replace('DUPLICATE_LISTING','You already have an active job with this title.').replace('ACCOUNT_SUSPENDED','Your account is suspended.');}

function recoveryView(){
  $('#nav').hidden=true;
  app.innerHTML='<div class="card"><div class="auth-brand">SHAM<b>LOKO</b></div><h3>Set a new password</h3><input id="p1" type="password" placeholder="New password (6+ characters)"><input id="p2" type="password" placeholder="Confirm new password"><button id="sp">Save password</button><div id="msg" class="err"></div></div>';
  $('#sp').onclick=async()=>{const a=$('#p1').value;if(a.length<6)return $('#msg').textContent='Use at least 6 characters.';if(a!=$('#p2').value)return $('#msg').textContent='Passwords do not match.';
    const {error}=await db.auth.updateUser({password:a});if(error)return $('#msg').textContent=error.message;
    REC=false;history.replaceState(null,'',location.pathname);boot();};
}
boot().then(()=>{const m=location.hash.match(/job=([\w-]+)/);if(m&&S.profile)jobView(m[1]);});
</script></body></html>
